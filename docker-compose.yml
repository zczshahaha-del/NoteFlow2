services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: noteflow-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noteflow}
      POSTGRES_USER: ${POSTGRES_USER:-noteflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noteflow_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noteflow} -d ${POSTGRES_DB:-noteflow}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: noteflow-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    container_name: noteflow-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-noteflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-noteflow_password}
      DB_NAME: ${POSTGRES_DB:-noteflow}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
    volumes:
      - mem0_history:/app/data/mem0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noteflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  mem0_history:
