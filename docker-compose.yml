services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: noteflow-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noteflow}
      POSTGRES_USER: ${POSTGRES_USER:-noteflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noteflow_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noteflow} -d ${POSTGRES_DB:-noteflow}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: noteflow-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    container_name: noteflow-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-noteflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-noteflow_password}
      DB_NAME: ${POSTGRES_DB:-noteflow}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LLM_INPUT_USD_PER_MILLION_TOKENS: ${LLM_INPUT_USD_PER_MILLION_TOKENS:-0}
      LLM_OUTPUT_USD_PER_MILLION_TOKENS: ${LLM_OUTPUT_USD_PER_MILLION_TOKENS:-0}
      EMBEDDING_USD_PER_MILLION_TOKENS: ${EMBEDDING_USD_PER_MILLION_TOKENS:-0}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-30}
      EMBEDDING_RATE_LIMIT_PER_MINUTE: ${EMBEDDING_RATE_LIMIT_PER_MINUTE:-60}
      RERANKER_RATE_LIMIT_PER_MINUTE: ${RERANKER_RATE_LIMIT_PER_MINUTE:-60}
      MEMORY_RATE_LIMIT_PER_MINUTE: ${MEMORY_RATE_LIMIT_PER_MINUTE:-60}
      INDEX_RATE_LIMIT_PER_MINUTE: ${INDEX_RATE_LIMIT_PER_MINUTE:-30}
      AGENT_RUNTIME: ${AGENT_RUNTIME:-legacy}
      DRAFT_RUNTIME: ${DRAFT_RUNTIME:-legacy}
      EDIT_RUNTIME: ${EDIT_RUNTIME:-legacy}
      RAG_PROVIDER: ${RAG_PROVIDER:-legacy}
      MEMORY_PROVIDER: ${MEMORY_PROVIDER:-legacy}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-legacy}
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-legacy}
      AGENT_SHADOW_ENABLED: ${AGENT_SHADOW_ENABLED:-false}
      LANGGRAPH_POC_ENABLED: ${LANGGRAPH_POC_ENABLED:-false}
      LANGGRAPH_SHADOW_ENABLED: ${LANGGRAPH_SHADOW_ENABLED:-false}
      LANGGRAPH_SHADOW_SAMPLE_PERCENT: ${LANGGRAPH_SHADOW_SAMPLE_PERCENT:-0}
      LANGGRAPH_SHADOW_TIMEOUT_MS: ${LANGGRAPH_SHADOW_TIMEOUT_MS:-2500}
      LANGGRAPH_SHADOW_MAX_CONCURRENCY: ${LANGGRAPH_SHADOW_MAX_CONCURRENCY:-2}
      LANGGRAPH_SHADOW_USER_IDS: ${LANGGRAPH_SHADOW_USER_IDS:-}
      LANGGRAPH_CANARY_ENABLED: ${LANGGRAPH_CANARY_ENABLED:-false}
      LANGGRAPH_CANARY_PERCENT: ${LANGGRAPH_CANARY_PERCENT:-0}
      LANGGRAPH_CANARY_USER_IDS: ${LANGGRAPH_CANARY_USER_IDS:-}
      LANGGRAPH_CANARY_ERROR_THRESHOLD: ${LANGGRAPH_CANARY_ERROR_THRESHOLD:-5}
      LANGGRAPH_CANARY_WINDOW_SECONDS: ${LANGGRAPH_CANARY_WINDOW_SECONDS:-60}
      LANGGRAPH_CANARY_COOLDOWN_SECONDS: ${LANGGRAPH_CANARY_COOLDOWN_SECONDS:-120}
      RAG_SHADOW_ENABLED: ${RAG_SHADOW_ENABLED:-false}
      MEMORY_SHADOW_ENABLED: ${MEMORY_SHADOW_ENABLED:-false}
      MEMORY_SHADOW_READ_PERCENT: ${MEMORY_SHADOW_READ_PERCENT:-0}
      MEMORY_SHADOW_WRITE_ENABLED: ${MEMORY_SHADOW_WRITE_ENABLED:-false}
      MEM0_CANARY_ENABLED: ${MEM0_CANARY_ENABLED:-false}
      MEM0_CANARY_PERCENT: ${MEM0_CANARY_PERCENT:-0}
      MEM0_CANARY_USER_IDS: ${MEM0_CANARY_USER_IDS:-}
      MEM0_TIMEOUT_MS: ${MEM0_TIMEOUT_MS:-1800}
      MEM0_ERROR_THRESHOLD: ${MEM0_ERROR_THRESHOLD:-5}
      MEM0_ERROR_WINDOW_SECONDS: ${MEM0_ERROR_WINDOW_SECONDS:-60}
      MEM0_CIRCUIT_COOLDOWN_SECONDS: ${MEM0_CIRCUIT_COOLDOWN_SECONDS:-120}
      MEM0_COLLECTION_NAME: ${MEM0_COLLECTION_NAME:-noteflow_mem0_v1}
      MEM0_HISTORY_DB_PATH: ${MEM0_HISTORY_DB_PATH:-/app/data/mem0/history.db}
      MEMORY_CONTEXT_LIMIT: ${MEMORY_CONTEXT_LIMIT:-6}
      AI_CANARY_PERCENT: ${AI_CANARY_PERCENT:-0}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-900}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-120}
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-40}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      RAG_RERANK_TIMEOUT_SECONDS: ${RAG_RERANK_TIMEOUT_SECONDS:-3}
      RAG_BM25_TOKENIZER: ${RAG_BM25_TOKENIZER:-jieba_search}
      RAG_V2_INDEX_ENABLED: ${RAG_V2_INDEX_ENABLED:-false}
      RAG_REWRITE_ENABLED: ${RAG_REWRITE_ENABLED:-true}
      RAG_BM25_ENABLED: ${RAG_BM25_ENABLED:-true}
      RAG_VECTOR_ENABLED: ${RAG_VECTOR_ENABLED:-true}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
      RAG_CHANNEL_TIMEOUT_MS: ${RAG_CHANNEL_TIMEOUT_MS:-1800}
      RAG_CONTEXT_TOKEN_BUDGET: ${RAG_CONTEXT_TOKEN_BUDGET:-6000}
      RAG_QUERY_CACHE_TTL_SECONDS: ${RAG_QUERY_CACHE_TTL_SECONDS:-60}
      RAG_TITLE_RRF_WEIGHT: ${RAG_TITLE_RRF_WEIGHT:-1.25}
      RAG_BM25_RRF_WEIGHT: ${RAG_BM25_RRF_WEIGHT:-1.0}
      RAG_VECTOR_RRF_WEIGHT: ${RAG_VECTOR_RRF_WEIGHT:-1.0}
      RAG_VECTOR_MIN_SIMILARITY: ${RAG_VECTOR_MIN_SIMILARITY:-0.45}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-50}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:5173,http://localhost:5173}
    volumes:
      - mem0_history:/app/data/mem0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noteflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  mem0_history:
