          &lt;h1&gt;NoteFlow 3.0 产品愿景&lt;/h1&gt;
          &lt;div class=&quot;nfr-meta&quot;&gt;&lt;span&gt;创建于 2026 年 8 月 26 日&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;1,284 字&lt;/span&gt;&lt;span class=&quot;nfr-tag&quot;&gt;产品&lt;/span&gt;&lt;span class=&quot;nfr-tag&quot;&gt;AI&lt;/span&gt;&lt;/div&gt;

          &lt;div class=&quot;nfr-page-content&quot;&gt;
            &lt;div class=&quot;nfr-callout&quot;&gt;NoteFlow 的价值不是保存更多信息，而是让已有知识在用户需要时重新参与工作。&lt;/div&gt;
            &lt;h2&gt;核心体验原则&lt;/h2&gt;
            &lt;p&gt;产品应该把记录、理解和行动连接成连续的工作流，让用户始终知道当前内容来自哪里、AI 做了什么，以及下一步会发生什么。&lt;/p&gt;
            &lt;div class=&quot;nfr-principles&quot;&gt;
              &lt;div class=&quot;nfr-principle&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;div&gt;&lt;strong&gt;内容始终是主角&lt;/strong&gt;&lt;small&gt;导航和工具在需要时出现，完成任务后安静退场。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;nfr-principle&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;div&gt;&lt;strong&gt;AI 的上下文清晰可见&lt;/strong&gt;&lt;small&gt;来源、执行状态和影响范围必须能够被理解。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;nfr-principle&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;div&gt;&lt;strong&gt;重要修改必须可逆&lt;/strong&gt;&lt;small&gt;生成结果先预览，确认后再写入正式笔记。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;p class=&quot;nfr-selected-copy&quot;&gt;真正的效率不是减少几次点击，而是减少在工具之间切换时丢失的思路。&lt;span class=&quot;nfr-selection-menu&quot;&gt;&lt;button type=&quot;button&quot; aria-label=&quot;加粗&quot;&gt;B&lt;/button&gt;&lt;button type=&quot;button&quot; aria-label=&quot;链接&quot;&gt;&lt;i data-lucide=&quot;link&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;加入对话&lt;/button&gt;&lt;/span&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/article&gt;

      &lt;div class=&quot;nfr-chat&quot; aria-live=&quot;polite&quot;&gt;
        &lt;div class=&quot;nfr-user-message&quot;&gt;根据当前笔记，归纳最需要优先优化的三个体验问题。&lt;/div&gt;
        &lt;div class=&quot;nfr-trace&quot;&gt;&lt;div class=&quot;nfr-trace-title&quot;&gt;任务已完成&lt;span&gt;1.4 秒&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;nfr-trace-steps&quot;&gt;&lt;span&gt;读取当前笔记&lt;/span&gt;&lt;i&gt;&lt;/i&gt;&lt;span&gt;分析结构&lt;/span&gt;&lt;i&gt;&lt;/i&gt;&lt;span&gt;生成回答&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

        &lt;div class=&quot;nfr-mode-content&quot; data-nfr-content=&quot;note&quot;&gt;
          &lt;article class=&quot;nfr-answer&quot;&gt;&lt;span class=&quot;nfr-answer-label&quot;&gt;基于当前笔记&lt;/span&gt;&lt;h2&gt;最需要先解决的是信息层级，而不是增加更多功能。&lt;/h2&gt;&lt;ol&gt;&lt;li&gt;&lt;b&gt;01&lt;/b&gt;&lt;span&gt;让正文成为视觉中心，降低目录和 AI 面板的常驻存在感。&lt;span class=&quot;nfr-citation&quot;&gt;来源 1&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;02&lt;/b&gt;&lt;span&gt;把 AI 的上下文、执行过程与结果分层展示，避免所有信息堆成聊天记录。&lt;span class=&quot;nfr-citation&quot;&gt;来源 2&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;03&lt;/b&gt;&lt;span&gt;统一草稿、编辑预览和正式笔记的视觉语言，减少模式切换造成的割裂。&lt;span class=&quot;nfr-citation&quot;&gt;来源 3&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/article&gt;
        &lt;/div&gt;
        &lt;div class=&quot;nfr-mode-content nfr-mode-note&quot; data-nfr-content=&quot;chat&quot; hidden&gt;普通对话不会自动引用笔记。输入问题后，AI 会直接回答并保留会话历史。&lt;/div&gt;
        &lt;div class=&quot;nfr-mode-content nfr-mode-note&quot; data-nfr-content=&quot;library&quot; hidden&gt;全库搜索会检索标题、关键词和向量结果，并在回答中显示真实来源。&lt;/div&gt;

        &lt;section class=&quot;nfr-sources&quot;&gt;&lt;div class=&quot;nfr-sources-title&quot;&gt;本次引用 · 3&lt;/div&gt;&lt;div class=&quot;nfr-source-row&quot;&gt;&lt;span class=&quot;nfr-source-icon&quot;&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;nfr-source-copy&quot;&gt;&lt;strong&gt;核心体验原则&lt;/strong&gt;&lt;span&gt;NoteFlow 3.0 产品愿景 · 第 2 节&lt;/span&gt;&lt;/span&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;nfr-source-row&quot;&gt;&lt;span class=&quot;nfr-source-icon&quot;&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;nfr-source-copy&quot;&gt;&lt;strong&gt;AI 知识库体验研究&lt;/strong&gt;&lt;span&gt;产品与设计 · 相关笔记&lt;/span&gt;&lt;/span&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/section&gt;
      &lt;/div&gt;

      &lt;div class=&quot;nfr-composer&quot;&gt;&lt;span class=&quot;nfr-selection-chip&quot;&gt;&lt;i data-lucide=&quot;text-select&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;已加入选中文字&lt;/span&gt;&lt;textarea aria-label=&quot;向 AI 提问&quot; placeholder=&quot;继续提问，或让 AI 修改当前笔记…&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;nfr-composer-foot&quot;&gt;&lt;i data-lucide=&quot;mic&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;问当前笔记&lt;/span&gt;&lt;button class=&quot;nfr-send&quot; type=&quot;button&quot; aria-label=&quot;发送&quot;&gt;&lt;i data-lucide=&quot;arrow-up&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/aside&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;noteflow-real-workspace&#x27;);
      const aiToggle = root.querySelector(&#x27;#nfr-ai-toggle&#x27;);
      const libraryToggle = root.querySelector(&#x27;#nfr-library-toggle&#x27;);
      const closeAi = root.querySelector(&#x27;.nfr-ai-panel .nfr-panel-head button:last-child&#x27;);
      const modeButtons = [...root.querySelectorAll(&#x27;[data-nfr-mode]&#x27;)];
      const modeContents = [...root.querySelectorAll(&#x27;[data-nfr-content]&#x27;)];

      const toggleAi = () =&gt; root.classList.toggle(&#x27;nfr-ai-hidden&#x27;);
      aiToggle.addEventListener(&#x27;click&#x27;, toggleAi);
      closeAi.addEventListener(&#x27;click&#x27;, toggleAi);
      libraryToggle.addEventListener(&#x27;click&#x27;, () =&gt; root.classList.toggle(&#x27;nfr-library-compact&#x27;));

      modeButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const mode = button.dataset.nfrMode;
        modeButtons.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
        modeContents.forEach((content) =&gt; { content.hidden = content.dataset.nfrContent !== mode; });
      }));
    })();
  &lt;/script&gt;
&lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
