<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteFlow · 架构问答交互预览</title>
<style>
  html { color-scheme: light dark; }
  body { margin: 0; background: light-dark(#eef3f6, #141a20); }
  main { max-width: 1090px; margin: auto; padding: clamp(12px, 4vw, 40px); }
</style>
</head>
<body>
<main>
<style>
#nf-ask-atlas {
  color-scheme:light dark;
  --paper:light-dark(#fff,#1e242a);
  --wash:light-dark(#f3f7f9,#202b34);
  --canvas:light-dark(#f6f9fa,#182129);
  --ink:light-dark(#253442,#e7eff6);
  --quiet:light-dark(#556d7d,#a8bdcc);
  --line:light-dark(#d9e4eb,#384a58);
  --dot:light-dark(#dce6ec,#31414d);
  --blue:light-dark(#316180,#a5d3ef);
  --blue-bg:light-dark(#e7f1f6,#273f51);
  --action:light-dark(#315e79,#9bd0ef);
  --action-ink:light-dark(#fff,#112d40);
  --active:light-dark(#a94e17,#ffb979);
  --active-bg:light-dark(#fff5e9,#3c2d23);
  --focus:light-dark(#5585ab,#9bd0ef);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
#nf-ask-atlas *,#nf-ask-atlas *::before,#nf-ask-atlas *::after{box-sizing:border-box}
#nf-ask-atlas [hidden]{display:none!important}
#nf-ask-atlas :is(h2,h3,p){margin:0}
#nf-ask-atlas button,#nf-ask-atlas input{font:inherit;color:inherit}
#nf-ask-atlas button{cursor:pointer;border:0;background:transparent}
#nf-ask-atlas button:focus-visible,#nf-ask-atlas input:focus-visible,#nf-ask-atlas summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#nf-ask-atlas .nf-header{height:55px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);font-weight:650}
#nf-ask-atlas .nf-brand{width:16px;height:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;transform:rotate(-8deg);color:var(--blue)}
#nf-ask-atlas .nf-brand b{background:currentColor;border-radius:2px}
#nf-ask-atlas .nf-brand b:nth-child(2){opacity:.56}
#nf-ask-atlas .nf-header small{color:var(--quiet);font-size:12px;font-weight:500;margin-left:4px}
#nf-ask-atlas .nf-layout{display:grid;grid-template-columns:150px minmax(0,1fr)}
#nf-ask-atlas .nf-side{background:var(--wash);border-right:1px solid var(--line);padding:16px 10px}
#nf-ask-atlas .nf-side nav{display:grid;gap:3px}
#nf-ask-atlas .nf-side p{padding:14px 8px 6px;color:var(--quiet);font-size:12px}
#nf-ask-atlas .nf-nav{display:flex;gap:8px;align-items:center;text-align:left;width:100%;min-height:34px;padding:6px 8px;border-radius:8px;white-space:nowrap;font-size:13px}
#nf-ask-atlas .nf-nav span{color:var(--quiet);font-size:11px;font-variant-numeric:tabular-nums}
#nf-ask-atlas .nf-nav:hover,#nf-ask-atlas .nf-subtle:hover{background:var(--blue-bg)}
#nf-ask-atlas .nf-nav[aria-current=true]{background:var(--blue-bg);color:var(--blue);font-weight:650}
#nf-ask-atlas .nf-main{min-width:0;padding:22px 23px 18px;display:grid;gap:16px;align-content:start}
#nf-ask-atlas .nf-titlebar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
#nf-ask-atlas .nf-titlebar h2{font-size:19px;font-weight:650;letter-spacing:-.025em}
#nf-ask-atlas .nf-subtle{color:var(--blue);padding:5px 7px;border-radius:6px;font-size:12px}
#nf-ask-atlas .nf-ask{display:grid;gap:8px}
#nf-ask-atlas .nf-form{display:flex;gap:6px;border:1px solid var(--line);border-radius:11px;padding:5px;align-items:center;background:var(--paper)}
#nf-ask-atlas .nf-form:focus-within{border-color:var(--focus)}
#nf-ask-atlas .nf-form input{min-width:0;flex:1;border:0;background:transparent;padding:7px 8px}
#nf-ask-atlas .nf-form input::placeholder{color:var(--quiet)}
#nf-ask-atlas .nf-send{background:var(--action);color:var(--action-ink);border-radius:7px;padding:7px 11px;font-weight:630;white-space:nowrap}
#nf-ask-atlas .nf-send:hover{filter:brightness(1.12)}
#nf-ask-atlas .nf-controls{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#nf-ask-atlas .nf-chip{padding:5px 8px;background:var(--blue-bg);color:var(--blue);border-radius:7px;font-size:12px;text-align:left}
#nf-ask-atlas .nf-chip:hover{text-decoration:underline;text-underline-offset:2px}
#nf-ask-atlas .nf-feedback{display:grid;gap:6px;min-height:28px;align-content:center;color:var(--quiet);font-size:13px;padding:2px 0}
#nf-ask-atlas .nf-feedback p{min-width:0;overflow-wrap:anywhere}
#nf-ask-atlas .nf-feedback[data-state=busy] p::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:7px;vertical-align:2px;animation:nf-ask-pulse .8s ease-in-out infinite alternate}
@keyframes nf-ask-pulse {to{opacity:.33;transform:scale(.75)}}
#nf-ask-atlas .nf-map{min-width:0}
#nf-ask-atlas .nf-map-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:5px 10px;margin-bottom:8px}
#nf-ask-atlas .nf-map-head h3{font-size:19px;font-weight:650;letter-spacing:-.02em}
#nf-ask-atlas .nf-origin{font-size:12px;color:var(--quiet)}
#nf-ask-atlas .nf-summary{color:var(--quiet);margin-bottom:12px;font-size:13px}
#nf-ask-atlas .nf-canvas{padding:19px 14px 13px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle,var(--dot) 1px,transparent 1.15px) 0 0 / 15px 15px,var(--canvas)}
#nf-ask-atlas .nf-diagram{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr) 20px minmax(0,1fr);align-items:stretch}
#nf-ask-atlas .nf-node{display:grid;align-content:start;gap:5px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;overflow-wrap:anywhere}
#nf-ask-atlas .nf-node:hover{border-color:var(--blue)}
#nf-ask-atlas .nf-node[aria-pressed=true]{background:var(--active-bg);border-color:var(--active)}
#nf-ask-atlas .nf-node strong{font-weight:650}
#nf-ask-atlas .nf-node small{color:var(--quiet);font-size:12px}
#nf-ask-atlas .nf-index{color:var(--blue);font-size:11px;font-variant-numeric:tabular-nums}
#nf-ask-atlas .nf-node[aria-pressed=true] .nf-index{color:var(--active);font-weight:700}
#nf-ask-atlas .nf-arrow{align-self:center;text-align:center;color:var(--quiet);font-size:16px}
#nf-ask-atlas .nf-arrow[data-active=true]{color:var(--active);font-weight:750}
#nf-ask-atlas .nf-arrow span:last-child{display:none}
#nf-ask-atlas .nf-detail{display:grid;gap:7px;margin-top:12px;padding:10px 11px;background:var(--paper);border:1px solid var(--line);border-radius:9px}
#nf-ask-atlas .nf-detail p{font-size:13px}
#nf-ask-atlas .nf-detail summary,#nf-ask-atlas .nf-trail summary{font-size:12px;color:var(--blue);cursor:pointer}
#nf-ask-atlas .nf-detail code{display:block;margin-top:5px;color:var(--quiet);font-size:12px;overflow-wrap:anywhere}
#nf-ask-atlas .nf-trail{border-top:1px solid var(--line);padding-top:10px}
#nf-ask-atlas .nf-trail ol{padding:0 0 0 20px;margin:7px 0 0;display:grid;gap:2px}
#nf-ask-atlas .nf-trail button{white-space:normal;text-align:left;overflow-wrap:anywhere}
@media(max-width:720px) {
  #nf-ask-atlas .nf-layout{grid-template-columns:1fr}
  #nf-ask-atlas .nf-side{border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  #nf-ask-atlas .nf-side nav{grid-template-columns:repeat(auto-fit,minmax(115px,1fr))}
  #nf-ask-atlas .nf-side p{padding:5px 8px 2px}
  #nf-ask-atlas .nf-main{padding:15px 13px}
}
@media(max-width:510px) {
  #nf-ask-atlas .nf-header{padding-inline:13px}
  #nf-ask-atlas .nf-diagram{grid-template-columns:1fr;gap:1px}
  #nf-ask-atlas .nf-arrow span:first-child{display:none}
  #nf-ask-atlas .nf-arrow span:last-child{display:inline}
  #nf-ask-atlas .nf-form input{font-size:16px}
}
@media(pointer:coarse){#nf-ask-atlas :is(.nf-nav,.nf-chip,.nf-subtle,.nf-send){min-height:44px}}
@media(prefers-reduced-motion:reduce){#nf-ask-atlas .nf-feedback[data-state=busy] p::before{animation:none}}
</style>
<div id="nf-ask-atlas" aria-label="架构问答交互预览">
  <header class="nf-header"><span class="nf-brand" aria-hidden="true"><b></b><b></b><b></b><b></b></span>NoteFlow <small>交互预览</small></header>
  <div class="nf-layout">
    <aside class="nf-side" aria-label="架构导航">
      <button class="nf-nav" type="button" data-demo="overview"><span aria-hidden="true">◎</span>整个系统</button>
      <p>操作</p>
      <nav aria-label="示例操作">
        <button class="nf-nav" type="button" data-demo="chat"><span>01</span>普通聊天</button>
        <button class="nf-nav" type="button" data-demo="qa"><span>02</span>全库问答</button>
        <button class="nf-nav" type="button" data-demo="save"><span>03</span>手动保存</button>
        <button class="nf-nav" type="button" data-demo="create" aria-current="true"><span>04</span>AI 新建笔记</button>
        <button class="nf-nav" type="button" data-demo="preview"><span>05</span>修改预览</button>
        <button class="nf-nav" type="button" data-demo="quick"><span>06</span>选区快捷修改</button>
        <button class="nf-nav" type="button" data-demo="memory"><span>07</span>保存记忆</button>
        <button class="nf-nav" type="button" data-demo="attachment"><span>08</span>上传附件</button>
      </nav>
    </aside>
    <section class="nf-main" aria-label="问答和流程图">
      <div class="nf-titlebar"><h2>系统架构</h2></div>
      <div class="nf-ask">
        <form class="nf-form">
          <input type="text" aria-label="想看什么流程" placeholder="想看什么流程？" maxlength="160" autocomplete="off" required>
          <button type="submit" class="nf-send">问 Codex <span aria-hidden="true">↑</span></button>
        </form>
        <div class="nf-controls" data-composer-options>
          <button class="nf-subtle" type="button" data-context></button>
          <button class="nf-chip" type="button" data-suggest hidden></button>
        </div>
        <div class="nf-feedback" hidden>
          <p role="status"></p>
          <div class="nf-controls" data-options hidden>
            <button class="nf-chip" type="button" data-choose="stop">停止生成</button>
            <button class="nf-chip" type="button" data-choose="discard">取消整份草稿</button>
          </div>
        </div>
      </div>
      <div class="nf-map">
        <div class="nf-map-head"><h3 data-title></h3><span class="nf-origin" data-origin></span></div>
        <p class="nf-summary" data-summary></p>
        <div class="nf-canvas" aria-label="流程节点">
          <div class="nf-diagram">
            <button class="nf-node" data-step="0" type="button"><span class="nf-index">01</span><strong></strong><small></small></button>
            <span class="nf-arrow" aria-hidden="true"><span>→</span><span>↓</span></span>
            <button class="nf-node" data-step="1" type="button"><span class="nf-index">02</span><strong></strong><small></small></button>
            <span class="nf-arrow" aria-hidden="true"><span>→</span><span>↓</span></span>
            <button class="nf-node" data-step="2" type="button"><span class="nf-index">03</span><strong></strong><small></small></button>
          </div>
          <div class="nf-detail">
            <p data-detail aria-live="polite"></p>
            <details data-source hidden><summary>代码出处</summary><code></code></details>
          </div>
        </div>
      </div>
      <details class="nf-trail" hidden><summary></summary><ol></ol></details>
    </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('nf-ask-atlas');
  const $ = selector => root.querySelector(selector);
  const $$ = selector => [...root.querySelectorAll(selector)];
  const make = (title, summary, ...nodes) => ({title, summary, nodes});
  const flows = {
    overview: make('整个系统','从浏览器进入业务服务，再按需读写数据。',
      ['前端','发出操作','浏览器里打开笔记、发起聊天或编辑。'],
      ['后端','处理请求','接口确认身份，把请求交给相应的笔记、AI 或记忆模块。'],
      ['数据与模型','返回结果','根据操作使用项目数据库、文件存储、记忆服务或模型。']),
    chat: make('普通聊天','当前问题和可用上下文被整理后送给模型。',
      ['对话界面','发送问题','前端发送问题、近期对话和页面信息。'],
      ['任务与上下文','准备回答材料','判断回答方式，并按需召回允许使用的记忆。'],
      ['模型','流式回答','模型生成文字，接口把内容逐段传回前端。']),
    qa: make('全库问答','先查本人的笔记，再用有来源的片段回答。',
      ['问答界面','发送问题','请求注明使用全库问答模式。'],
      ['检索服务','查找笔记片段','检索范围限定为本人笔记，并对候选片段排序。'],
      ['模型','返回带出处的答案','模型用找到的片段回答，服务校验引用后返回。']),
    save: make('手动保存','正式正文保存后，检索索引在后台更新。',
      ['编辑器','提交新正文','同时提交笔记标识与编辑时的版本。'],
      ['笔记服务','检查原文版本','检查归属与版本，发现冲突时保留本地修改。'],
      ['项目数据库','提交正式笔记','正文、版本和索引待办一起提交。']),
    create: make('AI 新建笔记','从确认写作要求，到生成草稿，再到保存正式笔记。',
      ['写作入口','确认标题与要求','把一句需求整理为标题和写作要求，由用户确认后开始。'],
      ['草稿服务','生成大纲与章节','模型逐节生成，草稿服务把完成的内容和进度存起来。','server/app/services/draft_worker.py · _run_claim'],
      ['笔记服务','确认后保存','用户采用草稿后，才保存成正式笔记。','server/app/routers/drafts.py · save_draft_to_notes']),
    preview: make('修改预览','候选稿独立保存，应用时再写回正文。',
      ['编辑器','指定修改范围','提交笔记、选定范围和修改要求。'],
      ['修改服务','生成候选稿','按范围生成改写，并独立保存预览。'],
      ['笔记服务','应用候选稿','用户确认后复查原文，再写回正式笔记。']),
    quick: make('选区快捷修改','先在选区旁审阅，采用后才替换正文。',
      ['编辑器','锁定选中文字','提交选区内容和修改意见。'],
      ['改写服务','返回候选文字','生成文字并直接返回，不创建服务端修改预览。'],
      ['编辑器','替换后自动保存','确认选区仍匹配，再采用候选并发起普通保存。']),
    memory: make('保存记忆','用户明确要求记住的内容，要先经过保存规则。',
      ['对话界面','收到记忆要求','提取用户明确想记住的内容。'],
      ['记忆管理','检查来源与规则','根据当前账号和记忆策略判断能否保存。'],
      ['记忆存储','保存可用记忆','按项目的记忆接口写入，供以后按需召回。']),
    attachment: make('上传附件','文件字节和文件记录分别保存。',
      ['浏览器','发送附件','上传文件时附上会话和可选的笔记标识。'],
      ['附件服务','把字节写到磁盘','检查账号和笔记归属后，得到文件位置和大小。'],
      ['项目数据库','登记文件记录','提交文件的标识、位置、名称和归属，再返回附件 ID。']),
    stop: make('停止生成后，章节去哪了？','已保存的章节留在草稿里，未完成的章节可以继续生成。',
      ['草稿界面','点击停止生成','前端对当前草稿发出停止请求。','server/app/routers/drafts.py · stop_all_draft_sections'],
      ['草稿服务','标记停止并终止任务','先提交停止状态，再取消正在运行的生成任务。','server/app/routers/drafts.py · stop_all_draft_sections'],
      ['项目数据库','保留已保存的章节','已经保存的正文仍在草稿章节记录里；没有正文的中断章节回到待生成。','server/app/services/draft_worker.py · reset_interrupted_sections']),
    discard: make('取消整份草稿','草稿被标记为已取消，已保存为正式笔记的草稿无法取消。',
      ['草稿界面','请求取消草稿','对当前草稿提交取消操作。'],
      ['草稿接口','检查草稿状态','草稿已保存为正式笔记时，接口拒绝取消。','server/app/routers/drafts.py · cancel_draft'],
      ['项目数据库','标记为已取消','更新草稿状态与取消时间，此接口没有删除章节记录。','server/app/routers/drafts.py · cancel_draft']),
  };
  const followup = '停止生成后，写好的章节去哪了？';
  const ask = $('.nf-form');
  const input = ask.querySelector('input');
  const send = $('.nf-send');
  const feedback = $('.nf-feedback');
  const options = $('[data-options]');
  const contextButton = $('[data-context]');
  const suggestion = $('[data-suggest]');
  const source = $('[data-source]');
  const trail = $('.nf-trail');
  let current = 'create', selected = 0, context = true, fromQuestion = false, pending = 0, activeQuery = '';
  const history = [];
  function updateContext() {
    contextButton.textContent = context ? '接着问 · ' + flows[current].title + ' ×' : '带上当前图';
    suggestion.hidden = !(current === 'create' && context);
    suggestion.textContent = followup + ' ↗';
  }
  function setFeedback(state, message = '') {
    feedback.hidden = !message;
    $('[data-composer-options]').hidden = state === 'busy' || state === 'clarify';
    feedback.dataset.state = state;
    feedback.querySelector('p').textContent = message;
    options.hidden = state !== 'clarify';
  }
  function selectStep(step) {
    selected = step;
    $$('.nf-node').forEach((el, index) => el.setAttribute('aria-pressed', String(index === selected)));
    $$('.nf-arrow').forEach((el, index) => el.dataset.active = String(index === selected - 1 || (selected === 0 && index === 0)));
    const node = flows[current].nodes[selected];
    $('[data-detail]').textContent = node[2];
    source.hidden = !node[3];
    source.open = false;
    source.querySelector('code').textContent = node[3] || '';
  }
  function show(key, generated) {
    current = key;
    fromQuestion = generated;
    context = true;
    $('[data-title]').textContent = flows[key].title;
    $('[data-summary]').textContent = flows[key].summary;
    $('[data-origin]').textContent = generated ? '问答结果' : key === 'overview' ? '' : '示例';
    $$('[data-demo]').forEach(el => {
      if (!fromQuestion && el.dataset.demo === key) el.setAttribute('aria-current','true');
      else el.removeAttribute('aria-current');
    });
    $$('.nf-node').forEach((el, index) => {
      const [name, action] = flows[key].nodes[index];
      el.querySelector('strong').textContent = name;
      el.querySelector('small').textContent = action;
    });
    selectStep(0);
    updateContext();
  }
  function cancelPending() {
    clearTimeout(pending);
    pending = 0;
    send.firstChild.textContent = '问 Codex ';
  }
  function addHistory(question, result) {
    history.push({question, result});
    trail.hidden = false;
    trail.querySelector('summary').textContent = '问答记录 · ' + history.length;
    const li = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'nf-subtle';
    button.textContent = question;
    button.addEventListener('click', () => {
      cancelPending();
      setFeedback('');
      show(result, true);
    });
    li.append(button);
    trail.querySelector('ol').append(li);
  }
  function classify(question) {
    const draftContext = context && ['create','stop','discard'].includes(current);
    if (/取消(整份|整个)?草稿|丢弃草稿/.test(question)) return 'discard';
    if (/停止生成|停止.*(草稿|章节)|已生成.*章节|写好.*章节/.test(question)) return 'stop';
    if (/取消|中途/.test(question) && (draftContext || /笔记|草稿|生成/.test(question))) return 'clarify';
    if (/新建笔记|生成笔记|创建笔记/.test(question)) return 'create';
    if (/上传附件/.test(question)) return 'attachment';
    return '';
  }
  function run(question, choice) {
    cancelPending();
    activeQuery = question;
    if (document.activeElement === suggestion || options.contains(document.activeElement)) input.focus({preventScroll:true});
    input.value = '';
    setFeedback('busy','正在整理流程…');
    send.firstChild.textContent = '停止绘图 ';
    pending = setTimeout(() => {
      cancelPending();
      const key = choice || classify(question);
      if (key === 'clarify') {
        setFeedback('clarify','你说的是停止生成，还是取消整份草稿？');
      } else if (!key) {
        input.value = question;
        setFeedback('unsupported','预览可试「AI 新建笔记」「停止生成」或「上传附件」。');
      } else {
        setFeedback('');
        show(key, true);
        addHistory(question, key);
      }
    }, 650);
  }
  ask.addEventListener('submit', event => {
    event.preventDefault();
    if (pending) {
      cancelPending();
      input.value = activeQuery;
      setFeedback('stopped','已停止绘图。');
    } else if (input.value.trim()) run(input.value.trim());
  });
  send.addEventListener('click', event => {
    if (!pending) return;
    event.preventDefault();
    cancelPending();
    input.value = activeQuery;
    setFeedback('stopped','已停止绘图。');
  });
  contextButton.addEventListener('click', () => {
    context = !context;
    updateContext();
    input.focus();
  });
  suggestion.addEventListener('click', () => run(followup));
  $$('[data-choose]').forEach(button => button.addEventListener('click', () => run(activeQuery + ' · ' + button.textContent, button.dataset.choose)));
  $$('[data-demo]').forEach(button => button.addEventListener('click', () => {
    cancelPending();
    setFeedback('');
    show(button.dataset.demo, false);
  }));
  $$('.nf-node').forEach(button => button.addEventListener('click', () => selectStep(Number(button.dataset.step))));
  show('create', false);
})();
</script>
</main>
</body>
</html>
