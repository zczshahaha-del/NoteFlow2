#nf-workbench-proposal :where(.nf-screen) button { border:0; color:inherit; background:transparent; }
#nf-workbench-proposal .nf-screen { min-height:900px; background:var(--nf-paper); --nf-library-width:212px; --nf-reading-width:680px; --nf-reading-space:36px; }

#nf-workbench-proposal .nf-library { display:flex;flex-direction:column;padding:14px 10px 12px;min-width:0; }

#nf-workbench-proposal .nf-library-header svg { width:16px;height:16px;color:var(--nf-soft); }
#nf-workbench-proposal .nf-library-header .nf-icon { margin-left:auto; }

#nf-workbench-proposal .nf-note { display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 9px 10px 20px;border-radius:9px;font-size:13px; }

#nf-workbench-proposal .nf-note span { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
#nf-workbench-proposal .nf-note:hover { background:var(--nf-hover); }
#nf-workbench-proposal .nf-note[aria-current="page"] { background:var(--nf-select); }
#nf-workbench-proposal .nf-account { display:flex;align-items:center;gap:8px;margin-top:auto;padding:28px 4px 2px;font-size:12px; }
#nf-workbench-proposal .nf-avatar { display:grid;place-items:center;width:28px;height:28px;flex:none;background:var(--nf-avatar);color:light-dark(#fff,#fff);border-radius:50%; }
#nf-workbench-proposal .nf-avatar svg { width:16px;height:16px; }

#nf-workbench-proposal .nf-screen[data-library="false"] .nf-account { padding-left:0; }

#nf-workbench-proposal .nf-paper { max-width:var(--nf-reading-width);margin:auto; }

#nf-workbench-proposal .nf-meta { margin:10px 0 27px;color:var(--nf-soft);font-size:11px; }
#nf-workbench-proposal .nf-callout { display:flex;align-items:flex-start;gap:10px;background:var(--nf-mint);padding:14px 16px;border-radius:10px;line-height:1.7;font-size:14px;margin-bottom:25px; }
#nf-workbench-proposal .nf-callout svg { width:18px;height:18px;flex:none;margin-top:3px;color:var(--nf-blue); }

#nf-workbench-proposal .nf-reply p { margin:8px 0; }

<script>
(() => {
  const root=document.getElementById('nf-workbench-proposal');
  const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
  const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
  const notes=['Go 语言','AI 应用开发学习笔记','Git 入门学习笔记','Redis','Python 面试常见问题'];
  const chapters=[{group:'语言基础',title:'变量与类型',code:'package main\n\nimport "fmt"\n\nfunc main() {\n    name := "NoteFlow"\n    count := 3\n    fmt.Println(name, count)\n}',text:'变量让我们给数据一个名字。用 <code>:=</code> 简洁地声明变量，类型由初始值推断。'},{group:'语言基础',title:'函数与返回值',code:'func add(a, b int) int {\n    return a + b\n}\n\nresult := add(2, 3)',text:'函数把一段逻辑组织在一起。参数描述输入，返回值表达结果。'},{group:'并发与通信',title:'通道',code:'messages := make(chan string, 1)\nmessages <- "hello"\nfmt.Println(<-messages)',text:'通道用于传递数据。这里使用带缓冲的通道，先发送一条消息，再读取它。'},{group:'并发与通信',title:'同步与协作',code:'var wg sync.WaitGroup\nwg.Add(1)\ngo func() {\n    defer wg.Done()\n    // 处理任务\n}()\nwg.Wait()',text:'同步操作帮助我们明确何时开始、何时完成，避免用等待时间猜测任务状态。'}];
  const examples={
    'Git 入门学习笔记':[{group:'日常工作',title:'查看状态与提交',language:'bash',code:'git status\ngit add README.md\ngit commit -m "docs: 更新说明"',text:'先检查文件状态，再选择需要暂存的修改，最后提交。提交记录应清楚说明这次改了什么。'}],
    'Redis':[{group:'基础操作',title:'键与数据',language:'bash',code:'redis-cli SET note:title "Redis 学习笔记"\nredis-cli GET note:title',text:'通过键读取和写入数据。从简单的字符串操作开始理解命令与返回结果。'}],
    'Python 面试常见问题':[{group:'基础概念',title:'列表与字典',language:'python',code:'notes = ["Go", "Python", "Redis"]\ncounts = {"notes": len(notes)}\nprint(counts)',text:'列表保存有顺序的元素，字典表达键和值之间的关系。选择结构时，要先想清楚如何查找和更新数据。'}],
    'AI 应用开发学习笔记':[{group:'应用基础',title:'明确输入与输出',language:'javascript',code:'const task = {\n  input: "解释这篇笔记",\n  output: "要点与示例"\n};\nconsole.log(task.output);',text:'先描述任务边界，再设计输入和输出。真实业务还需要失败反馈、取消与数据保护。'}]
  };
  const collection=v=>examples[v.note]||chapters;
  const views=new Map();
  let revision=0;
  const saved=()=>{const state=window.openai?.widgetState;return state?.modelContent?.design==='noteflow-workbench-proposal'?state.privateContent:null;};
  function persist(){revision++;window.openai?.setWidgetState?.({modelContent:{design:'noteflow-workbench-proposal',revision:1,views:[...views].map(([id,v])=>({id,library:v.library,ai:v.ai,note:v.note,chapter:(collection(v)[v.chapter]||collection(v)[0]).title}))},privateContent:{_revision:revision,...Object.fromEntries([...views].map(([id,v])=>[id,{library:v.library,ai:v.ai,note:v.note,chapter:v.chapter,fold:v.fold}]))}}).catch(()=>{});}
  function highlight(screen){screen.querySelectorAll('pre code').forEach(code=>{const raw=code.textContent;code.innerHTML=window.nfPreviewHighlight.highlight(raw,{language:code.dataset.language||'go'}).value;});}
  function documentView(v){const items=collection(v),c=items[v.chapter]||items[0];return `<div class="nf-paper"><div class="nf-document-heading"><h1>${escape(v.note)}</h1><button type="button" class="nf-icon cursor-interaction" aria-label="展开本文目录" data-action="outline">${icon('list-tree')}</button></div><div class="nf-meta">更新于 10 月 14 日 · 学习笔记</div><div class="nf-callout">${icon('lightbulb')}<span>把概念、示例和关键结论放在一起，方便理解，也方便回来查阅。</span></div><article class="nf-prose"><h2>${v.chapter+1}. ${c.title}</h2><p>${c.text}</p><h3>从一个简单示例开始</h3><div class="nf-codeblock"><div class="nf-codebar"><span>${({go:"Go",bash:"Bash",python:"Python",javascript:"JavaScript"})[c.language||"go"]}</span><button type="button" class="nf-icon cursor-interaction" data-action="copy" aria-label="复制代码">${icon('copy')}</button></div><pre><code data-language="${c.language||'go'}">${escape(c.code)}</code></pre></div><p>先看输入，再看处理过程，最后看结果。把每一步连起来，比只记住语法更容易掌握。</p><p><strong>记住：</strong>示例是学习的起点，实际编写时还要考虑边界和错误处理。</p></article><nav class="nf-outline" aria-label="本文目录"><div class="nf-outline-head"><span>本文目录</span><button type="button" class="nf-text-button cursor-interaction" data-action="fold">${v.fold?'展开章节':'收起章节'} ${icon(v.fold?'chevron-down':'chevron-up')}</button></div><div class="nf-outline-groups" ${v.fold?'hidden':''}>${[...new Set(items.map(x=>x.group))].map(g=>`<div><p class="nf-meta" style="margin:14px 0 5px">${g}</p><div class="nf-outline-list">${items.map((x,i)=>x.group===g?`<button type="button" class="nf-chapter cursor-interaction" data-chapter="${i}" ${i===v.chapter?'aria-current="location"':''}>${i+1}. ${x.title}</button>`:'').join('')}</div></div>`).join('')}</div></nav></div>`;}
  function render(screen){const v=views.get(screen.dataset.view);screen.dataset.library=String(v.library);screen.dataset.ai=String(v.ai);screen.innerHTML=`<header class="nf-chrome"><button type="button" class="nf-icon cursor-interaction" aria-label="切换知识库" aria-pressed="${v.library}" data-action="library">${icon('panel-left')}</button><div class="nf-breadcrumb"><span>全栈开发</span>${icon('chevron-right')}<span>${escape(v.note)}</span></div><div class="nf-chrome-end"><span class="nf-saved">${icon('check')}已保存</span><button type="button" class="nf-text-button cursor-interaction" data-action="ai" aria-pressed="${v.ai}">${icon('sparkles')} AI 助手</button></div></header><div class="nf-layout"><aside class="nf-library" aria-label="知识库"><div class="nf-library-content"><div class="nf-library-header">${icon('book-open')}<span>知识库</span><button type="button" class="nf-icon cursor-interaction" aria-label="搜索笔记" data-action="search">${icon('search')}</button></div><label class="nf-search" hidden><input aria-label="筛选示例笔记" placeholder="搜索笔记" style="width:100%;font-size:16px;padding:8px;border:1px solid var(--nf-line);border-radius:7px;background:var(--nf-paper);color:var(--nf-ink)"></label><div class="nf-folder">${icon('chevron-down')}${icon('folder')}全栈开发</div><div class="nf-notes">${notes.map(n=>`<button type="button" class="nf-note cursor-interaction" data-note="${n}" ${n===v.note?'aria-current="page"':''}>${icon('file-text')}<span>${n}</span></button>`).join('')}</div></div><div class="nf-account"><span class="nf-avatar">${icon('user-round')}</span><span class="nf-account-name">示例用户</span></div></aside><main class="nf-reading">${documentView(v)}</main><aside class="nf-ai" aria-label="AI 助手"><div class="nf-ai-header">${icon('sparkles')}<span>AI 助手</span><button type="button" class="nf-icon cursor-interaction" aria-label="收起 AI 助手" data-action="ai">${icon('panel-right-close')}</button></div><div class="nf-ai-context">${icon('file-text')}<span>参考 · ${escape(v.note)}</span></div><div class="nf-message nf-user-message">帮我把这一节的重点讲清楚。</div><div class="nf-message nf-reply"><p>可以。这一节可以抓住三个部分：</p><p><strong>概念是什么</strong><br>先弄清它解决的问题。</p><p><strong>示例怎么运行</strong><br>沿着输入、处理和结果读一遍。</p><p><strong>什么时候使用</strong><br>把它和你的实际任务联系起来。</p><div class="nf-actions"><button type="button" class="nf-icon cursor-interaction" aria-label="复制回复" data-action="copy-reply">${icon('copy')}</button><span>10:24</span></div></div><div class="nf-compose"><textarea aria-label="示例对话输入" placeholder="继续聊聊这篇笔记…"></textarea><div class="nf-compose-footer"><span>对话</span><button type="button" class="nf-icon nf-send cursor-interaction" data-action="send" aria-label="发送示例消息">${icon('arrow-up')}</button></div></div><div class="nf-status" role="status" aria-live="polite"></div></aside></div>`;highlight(screen);if(window.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
  function applyState(state){if(!state||Number(state._revision||0)<revision)return;revision=Number(state._revision||0);for(const [id,value] of Object.entries(state)){const v=views.get(id);if(!v)continue;const next={library:Boolean(value.library),ai:Boolean(value.ai),note:notes.includes(value.note)?value.note:v.note,chapter:Number.isInteger(value.chapter)&&chapters[value.chapter]?value.chapter:v.chapter,fold:Boolean(value.fold)};const changed=Object.keys(next).some(k=>v[k]!==next[k]);Object.assign(v,next);if(changed)render(v.screen);}}
  root.querySelectorAll('.nf-screen').forEach(screen=>{views.set(screen.dataset.view,{screen,library:screen.dataset.library==='true',ai:screen.dataset.ai==='true',note:'Go 语言',chapter:0,fold:true});render(screen);});applyState(saved());
  root.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;const screen=button.closest('.nf-screen');if(!screen)return;const v=views.get(screen.dataset.view),action=button.dataset.action;
    if(action==='library'){v.library=!v.library;if(v.library&&v.ai&&screen.clientWidth<940){v.ai=false;screen.dataset.ai='false';screen.querySelector('.nf-chrome [data-action="ai"]').setAttribute('aria-pressed','false');}screen.dataset.library=String(v.library);button.setAttribute('aria-pressed',String(v.library));}
    else if(action==='ai'){v.ai=!v.ai;if(v.ai&&v.library&&screen.clientWidth<940){v.library=false;screen.dataset.library='false';screen.querySelector('.nf-chrome [data-action="library"]').setAttribute('aria-pressed','false');}screen.dataset.ai=String(v.ai);screen.querySelector('.nf-chrome [data-action="ai"]').setAttribute('aria-pressed',String(v.ai));}
    else if(button.dataset.chapter){v.chapter=Number(button.dataset.chapter);render(screen);}
    else if(button.dataset.note){v.note=button.dataset.note;v.chapter=0;render(screen);}
    else if(action==='fold'){v.fold=!v.fold;screen.querySelector('.nf-outline-groups').hidden=v.fold;button.innerHTML=(v.fold?'展开章节':'收起章节')+icon(v.fold?'chevron-down':'chevron-up');if(window.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
    else if(action==='outline'){v.fold=!v.fold;const groups=screen.querySelector('.nf-outline-groups');groups.hidden=v.fold;}
    else if(action==='search'){const field=screen.querySelector('.nf-search');field.hidden=!field.hidden;if(!field.hidden)field.querySelector('input').focus();}
    else if(action==='send'){const input=screen.querySelector('textarea');if(!input.value.trim())return;screen.querySelector('.nf-status').textContent='这是交互预览，不会调用 AI 或保存消息。';}
    else if(action==='copy'||action==='copy-reply'){const text=action==='copy'?screen.querySelector('pre code').textContent:screen.querySelector('.nf-reply').innerText;try{await navigator.clipboard.writeText(text);button.setAttribute('aria-label','已复制');button.innerHTML=icon('check');if(window.lucide)lucide.createIcons({attrs:{width:16,height:16}});}catch{button.setAttribute('aria-label','复制不可用');}}
    persist();
  });
  root.addEventListener('input',e=>{if(!e.target.matches('.nf-search input'))return;const q=e.target.value.trim().toLocaleLowerCase();e.target.closest('.nf-screen').querySelectorAll('.nf-note').forEach(n=>{n.hidden=!n.dataset.note.toLocaleLowerCase().includes(q);});});
  window.addEventListener('openai:set_globals',e=>{const state=e.detail?.globals?.widgetState;if(state?.modelContent?.design==='noteflow-workbench-proposal')applyState(state.privateContent);});
  if(globalThis.Tweak)for(const v of views.values()){const tuning={space:36,width:680,library:212};const renderTuning=()=>{v.screen.style.setProperty('--nf-reading-space',tuning.space+'px');v.screen.style.setProperty('--nf-reading-width',tuning.width+'px');v.screen.style.setProperty('--nf-library-width',tuning.library+'px');};const tweak=new Tweak({container:v.screen,onChange:renderTuning});tweak.addSlider(tuning,'space',{label:'正文留白',min:20,max:52,step:4,unit:'px'});tweak.addSlider(tuning,'width',{label:'正文最大宽度',min:560,max:760,step:40,unit:'px'});tweak.addSlider(tuning,'library',{label:'知识库宽度',min:200,max:260,step:12,unit:'px'});}
})();
</script>
