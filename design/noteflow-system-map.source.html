<div id="nf-system-map" aria-label="NoteFlow 可展开的系统架构与数据流">
  <header class="map-heading">
    <div><h2>NoteFlow · 系统地图</h2><span class="text-small text-muted">当前实现 · 模块可以展开 · 数据可以沿路看</span></div>
  </header>
  <div class="viz-controls map-scenario-controls">
    <label class="form-label" for="nf-map-scenario">看一次操作
      <select id="nf-map-scenario" class="form-select">
        <option value="overview">整个系统</option>
        <option value="chat">普通聊天：读取个人记忆后回答</option>
        <option value="qa">全库问答：找笔记，再回答</option>
        <option value="save">手动编辑：保存，再更新索引</option>
        <option value="create">AI 新建笔记</option>
        <option value="preview">AI 修改：预览，再确认应用</option>
        <option value="quick">选区快捷修改：采用，再自动保存</option>
        <option value="remember">保存记忆：检查、排队、整理</option>
        <option value="attachment">上传附件：文件与元数据</option>
      </select>
    </label>
  </div>
  <div id="nf-map-reader-start"></div>
  <div class="map-reader" id="nf-map-reader">
  <div class="viz-controls map-controls">
    <div class="viz-row map-step-controls" role="group" aria-label="阅读步骤">
      <label class="form-label" for="nf-map-mode">阅读方式
        <select class="form-select" id="nf-map-mode"><option value="manual">单步阅读</option><option value="auto">自动播放</option></select>
      </label>
      <button type="button" class="btn" id="nf-map-prev" disabled>上一步</button>
      <button type="button" class="btn btn-primary" id="nf-map-next" disabled>下一步</button>
      <button type="button" class="btn" id="nf-map-play" hidden disabled>开始播放</button>
      <label class="form-label map-auto-speed" for="nf-map-speed" hidden>停留时间
        <select class="form-select" id="nf-map-speed"><option value="4000">每步 4 秒</option><option value="6000" selected>每步 6 秒</option><option value="10000">每步 10 秒</option></select>
      </label>
    </div>
  </div>
  <div class="map-position">
    <div class="map-reading-live" aria-live="polite" aria-atomic="true">
      <div class="map-step-meta"><span id="nf-map-flow"></span><span id="nf-map-reading" role="status"></span><span id="nf-map-count" class="tabular-nums">全貌</span></div>
      <div id="nf-map-overview"><strong id="nf-map-action">选择一个操作，沿着数据看</strong><p id="nf-map-payload">每一步会交代数据从哪来、传了什么、到哪去。</p></div>
    </div>
  </div>
  </div>
  <section id="nf-map-operation" aria-label="当前操作的模块与数据流" hidden></section>
  <div class="map-legend text-small text-muted" id="nf-map-legend">
    <span><span class="map-key"></span>调用 / 返回</span>
    <span><span class="map-key map-key-data"></span>读写 / 规则</span>
    <span><span class="map-key map-key-active"></span>当前数据方向</span>
    <span><span class="map-key map-key-complete"></span>已走过</span>
    <span>点模块展开，点连线看数据</span>
    <button type="button" class="btn btn-ghost" id="nf-map-fold" disabled>收起已展开</button>
  </div>
  <div class="map-board" id="nf-map-board">
    <svg class="map-wires" aria-hidden="true" focusable="false"></svg>
    <div class="map-grid" id="nf-map-grid"></div>
  </div>
  <footer class="map-foot text-small text-muted">
    <details><summary>本流程的范围与限制</summary><span id="nf-map-foot">浏览器 → 一个 FastAPI 后端 → 项目数据库、模型服务与 Hindsight。</span></details>
  </footer>
</div>
<style>
  #nf-system-map { --map-gap:calc(var(--font-size-base) * 2.5); --map-active:var(--viz-series-2); color:var(--foreground); }
  #nf-system-map [hidden] { display:none !important; }
  #nf-system-map .map-heading { display:flex; align-items:start; padding-inline-end:96px; margin-bottom:calc(var(--font-size-base) * 1.1); }
  #nf-system-map .map-controls { margin-bottom:calc(var(--font-size-base) * .8); }
  #nf-system-map .map-position { display:grid; gap:calc(var(--font-size-base) * .35); min-height:calc(var(--font-size-base) * 5); margin-bottom:calc(var(--font-size-base) * .65); }
  #nf-system-map .map-legend { display:flex; flex-wrap:wrap; gap:calc(var(--font-size-base) * .6) calc(var(--font-size-base) * 1.2); margin-bottom:calc(var(--font-size-base) * .6); }
  #nf-system-map .map-legend > span { display:inline-flex; align-items:center; gap:6px; }
  #nf-system-map .map-key { display:inline-block; width:20px; height:0; border-top:1px solid var(--muted-foreground); }
  #nf-system-map .map-key-data { border-top-style:dashed; }
  #nf-system-map .map-key-active { border-top:3px solid var(--map-active); }
  #nf-system-map .map-key-complete { border-top:2px solid var(--viz-series-1); }
  #nf-system-map .map-board { position:relative; }
  #nf-system-map .map-grid { --map-columns:3; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); column-gap:calc(var(--font-size-base) * 1.65); row-gap:var(--map-gap); padding:8px 24px 12px; align-items:start; }
  #nf-system-map .module-detail { grid-column:1/-1; min-width:0; }
  #nf-system-map .detail-canvas { position:relative; }
  #nf-system-map .detail-wires { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #nf-system-map .map-node { position:relative; min-width:0; display:grid; gap:calc(var(--font-size-base) * .5); transition:opacity .25s ease; }
  #nf-system-map .map-node[data-span="all"] { grid-column:1 / -1; width:65%; justify-self:center; }
  #nf-system-map .map-node[data-node="db"] { width:100%; }
  #nf-system-map .map-node[data-col="1"] { grid-column:1; }
  #nf-system-map .map-node[data-col="2"] { grid-column:2; }
  #nf-system-map .map-node[data-col="3"] { grid-column:3; }
  #nf-system-map .map-node[data-row="1"] { grid-row:1; }
  #nf-system-map .map-node[data-row="2"] { grid-row:2; }
  #nf-system-map .map-node[data-row="3"] { grid-row:3; }
  #nf-system-map .map-node[data-row="4"] { grid-row:4; }
  #nf-system-map .map-node[data-row="5"] { grid-row:5; }
  #nf-system-map .map-node[data-row="6"] { grid-row:6; }
  #nf-system-map .map-node[data-row="7"] { grid-row:7; }
  #nf-system-map .map-node[data-row="8"] { grid-row:8; }
  #nf-system-map .map-node-meta { display:flex; justify-content:space-between; gap:8px; }
  #nf-system-map .map-inner { display:grid; gap:calc(var(--font-size-base) * .6); overflow-wrap:anywhere; }
  #nf-system-map .map-inner[hidden] { display:none; }
  #nf-system-map .map-inner ol { margin:0; padding-left:calc(var(--font-size-base) * 1.4); display:grid; gap:calc(var(--font-size-base) * .4); }
  #nf-system-map .map-inner details { overflow-wrap:anywhere; }
  #nf-system-map .map-inner summary { color:var(--muted-foreground); }
  #nf-system-map .map-source { display:grid; gap:calc(var(--font-size-base) * .35); margin-top:calc(var(--font-size-base) * .5); }
  #nf-system-map .map-source code { white-space:normal; overflow-wrap:anywhere; }
  #nf-system-map .map-wires { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
  #nf-system-map .map-wires path { fill:none; stroke:color-mix(in srgb,var(--muted-foreground) 50%,transparent); stroke-width:1.3; }
  #nf-system-map .map-wires .wire-data { stroke-dasharray:4 5; }
  #nf-system-map .map-wires .wire-route { stroke:color-mix(in srgb,var(--muted-foreground) 42%,transparent); }
  #nf-system-map .map-wires .wire-complete { stroke:var(--viz-series-1); stroke-width:1.6; }
  #nf-system-map .map-wires .wire-active { stroke:var(--map-active); stroke-width:3; }
  #nf-system-map .map-wires .wire-hit { stroke:transparent; stroke-width:18; pointer-events:stroke; }
  #nf-system-map .map-wires .wire-packet { fill:var(--map-active); stroke:none; }
  #nf-system-map .map-wires .wire-arrow { fill:var(--muted-foreground); stroke:none; }
  #nf-system-map .map-wires .wire-arrow-active { fill:var(--map-active); stroke:none; }
  #nf-system-map .map-foot { margin-top:calc(var(--font-size-base) * .8); }
  @media (max-width:559px) {
    #nf-system-map { --map-gap:calc(var(--font-size-base) * 2); }
    #nf-system-map .map-grid { --map-columns:1; grid-template-columns:minmax(0,1fr); padding-inline:24px; }
    #nf-system-map .map-node[data-node] { grid-column:1; grid-row:auto; width:100%; }
    #nf-system-map .map-heading { padding-inline-end:90px; }
    #nf-system-map .map-position { min-height:calc(var(--font-size-base) * 7); }
  }
  @media (prefers-reduced-motion:reduce) {
    #nf-system-map .map-node { transition:none; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('nf-system-map');
  const board = root.querySelector('#nf-map-board');
  const grid = root.querySelector('#nf-map-grid');
  const svg = root.querySelector('.map-wires');
  const chooser = root.querySelector('#nf-map-scenario');
  const play = root.querySelector('#nf-map-play');
  const previous = root.querySelector('#nf-map-prev');
  const next = root.querySelector('#nf-map-next');
  const mode = root.querySelector('#nf-map-mode');
  const speed = root.querySelector('#nf-map-speed');
  const reading = root.querySelector('#nf-map-reading');
  const fold = root.querySelector('#nf-map-fold');
  const action = root.querySelector('#nf-map-action');
  const payload = root.querySelector('#nf-map-payload');
  const count = root.querySelector('#nf-map-count');
  const reader = root.querySelector('#nf-map-reader');
  const overviewStory = root.querySelector('#nf-map-overview');
  const flowName = root.querySelector('#nf-map-flow');
  const foot = root.querySelector('#nf-map-foot');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const detailData = window.NoteFlowMapDetails;
  if(!detailData?.modules || !detailData?.traces) throw new Error('Missing architecture detail data');
  const nodes = [
    { id:'ui', title:'前端工作区', sub:'输入、编辑、审阅与显示', icon:'layout-panel-left', type:'浏览器 · React / Tiptap', row:1, span:'all',
      note:'选区快捷改写的候选先回到编辑器；点击采用后才替换，仍可撤销。浏览器不直接连数据库。',
      sources:['src/store/index.tsx','src/store/persistence.ts','src/services/offlineQueue.ts'] },
    { id:'api', title:'登录检查与业务接口', sub:'验身份、校验请求、分入口', icon:'shield-check', type:'后端 · FastAPI', row:2, span:'all',
      note:'Redis 保存限流计数，不保存笔记正文。Redis 不可用时有限流内存回退；普通保存不需要模型判断意图。',
      sources:['server/app/deps.py','server/app/routers/agent.py','server/app/routers/notes.py','server/app/main.py'] },
    { id:'router', title:'任务判断与分流', sub:'这次回答、写作，还是管记忆？', icon:'git-branch', type:'后端 · Agent', row:3, span:'all',
      note:'模型只提出计划，程序决定能否执行。选区快捷改写、手动保存和附件上传直接走专用接口。',
      sources:['server/app/services/turn_planner.py','server/app/agent/langgraph_turn.py','server/app/routers/agent.py'] },
    { id:'notes', title:'笔记、草稿与修改', sub:'正式正文与候选稿分开', icon:'file-pen-line', type:'后端 · 笔记业务', row:4, col:1,
      note:'选区快捷改写是例外：只返回候选文字，不写服务器预览。普通保存仍有跨设备并发缺口（UI-45），不能当成已解决。',
      sources:['server/app/routers/notes.py','server/app/routers/drafts.py','server/app/routers/edits.py','server/app/services/note_edit.py'] },
    { id:'context', title:'回答与资料组织', sub:'按本轮需要选择资料', icon:'messages-square', type:'后端 · 只读回答', row:4, col:2,
      note:'当前笔记 / 选区问答与全库问答跳过个人记忆召回；全库没有命中时直接说明未找到。contextScope 硬边界仍待完善（AI-17）。',
      sources:['server/app/agent/langgraph_readonly.py','server/app/services/ai.py','server/app/rag/pipeline/service.py'] },
    { id:'memory', title:'记忆管理', sub:'决定哪些能存、哪些能用', icon:'list-filter', type:'后端 · 项目自己的规则', row:4, col:3,
      note:'它是现有后端里的服务，不是另一个 AI。记忆故障可降级普通回答；用户原话才是自动提取输入，任务取消流水不应变成个人经历。',
      sources:['server/app/memory/gateway.py','server/app/memory/service.py','server/app/memory/context.py'] },
    { id:'index', title:'检索与索引', sub:'让保存过的笔记能被找到', icon:'search', type:'后端 · RAG / 索引任务', row:5, col:1,
      note:'索引是可重建的派生数据，不能覆盖正式正文。保存成功与索引完成是两个时点；普通列表搜索另有 note_library 路径。',
      sources:['server/app/services/markdown_index.py','server/app/services/index_worker.py','server/app/services/note_library.py','server/app/rag/pipeline/service.py'] },
    { id:'prompt', title:'提示词拼装', sub:'模板 + 本轮资料 → 模型消息', icon:'braces', type:'后端 · 代码内的模板 / 函数', row:5, col:2,
      note:'目前散布在各服务的代码中，图里按职责合并展示。没有独立提示词平台；Git 有历史，独立发布与调用版本关联仍未完成（AI-16）。',
      sources:['server/app/services/turn_planner.py','server/app/services/ai.py','server/app/services/prompts.py','server/app/services/note_edit.py'] },
    { id:'worker', title:'记忆后台任务', sub:'排队后再整理，不阻塞主回答', icon:'list-todo', type:'后端 · 持久队列 / Outbox', row:5, col:3,
      note:'队列在数据库，不是仅放在进程内存。当前 worker 随 FastAPI 同进程启动，尚非独立微服务。',
      sources:['server/app/workers/outbox_worker.py','server/app/services/outbox.py','server/app/memory/gateway.py','server/app/main.py'] },
    { id:'model', title:'AI 模型接口', sub:'识别、回答、写作、生成向量', icon:'sparkles', type:'后端适配 → 外部模型', row:6, col:2,
      note:'一次操作可能多次调用模型。模型输出的候选稿不等于正式笔记；普通保存与上传文件不调用 AI。',
      sources:['server/app/providers/','server/app/services/ai.py','server/app/services/turn_planner.py'] },
    { id:'adapter', title:'统一记忆接口', sub:'项目契约 → 引擎适配器', icon:'plug', type:'后端 · MemoryEngine', row:6, col:3,
      note:'当前正式事实引擎只有 Hindsight。旧 Mem0 是另一条本地事实索引兼容路径，不代表已有可直接切换的第二个正式引擎。',
      sources:['server/app/memory/engine.py','server/app/providers/memory_registry.py','server/app/providers/hindsight.py'] },
    { id:'files', title:'附件服务与文件', sub:'文件本体在磁盘 / 挂载卷', icon:'paperclip', type:'后端服务 + 文件存储', row:7, col:1,
      note:'文件不在正文表里。文件操作与 SQL 不是同一事务；失败补偿仍待完善（UI-46），生产实际附件备份路径也待验收。',
      sources:['server/app/services/attachment_service.py','server/app/services/object_storage.py'] },
    { id:'runtime', title:'任务运行与检查点', sub:'记录运行、等待与生成进度', icon:'route', type:'后端 · LangGraph / Worker', row:7, col:2,
      note:'这层协助推进和恢复流程，不拥有笔记正文。并非每个接口都走 LangGraph；完整执行追踪与恢复语义仍待完善（AI-13 / AI-15）。',
      sources:['server/app/agent/','server/app/services/agent_checkpoints.py','server/app/services/draft_worker.py'] },
    { id:'hindsight', title:'Hindsight 记忆引擎', sub:'整理事实、关联关系与召回', icon:'brain', type:'独立服务 + 自己的数据库', row:7, col:3,
      note:'项目数据库管规则、来源状态和待办；引擎数据库管事实与关系。返回项目后，还要经过记忆管理的可用性过滤。',
      sources:['server/app/providers/hindsight.py','docs/architecture/memory-engine-boundary-2026-10-31.md'] },
    { id:'db', title:'项目数据库 · PostgreSQL', sub:'正文 / 版本 / 草稿 · 会话 / 检查点 · 规则 / 来源 / 队列 · 检索片段 / 向量 · 附件元数据', icon:'database', type:'NoteFlow 自己的数据', row:8, span:'all',
      note:'这些可以在同一个 PostgreSQL 里，由不同表承担职责。数据库是被多个模块调用的存储，不是所有请求都只在最后经过的一步。',
      sources:['server/app/models/db.py','server/app/repositories/','server/app/services/agent_checkpoints.py'] }
  ];
  const S = (from,to,title,data,kind='call',waitForUser=false) => ({from,to,title,data,kind,waitForUser});
  const planning = [
    S('router','prompt','组织意图识别提示','本轮消息 + 近期聊天 + 当前笔记 ID / 选区预览','data'),
    S('prompt','model','请模型提出计划','识别提示 + JSON Schema'),
    S('model','router','校验模型计划','意图、目标、来源；无效则修复或追问')
  ];
  const scenarios = {
    overview:{ foot:'浏览器 → 一个 FastAPI 后端 → 项目数据库、模型服务与 Hindsight。展开只看内部，始终保留全图。', steps:[] },
    chat:{ foot:'示例前提：记忆已开启、计划要求个人记忆且存在可用事实。失败可降级；自动保存新记忆是可选后续，见“保存记忆”。', steps:[
      S('ui','api','发送一个普通问题','问题 + 近期聊天 + 页面状态'),
      S('api','runtime','建立本轮运行','已认证账号 + 会话 + 本轮 runId'),
      S('runtime','db','记录运行与检查点','运行状态；不是长期记忆','data'),
      S('api','router','进入对话任务判断','mode=chat'), ...planning,
      S('router','context','选择普通回答','本轮计划要求 user_memory'),
      S('context','memory','申请相关个人记忆','账号 + 问题 + 允许的业务范围'),
      S('db','memory','读取记忆控制信息','开关、来源状态、人工修订 / 删除屏障','data'),
      S('memory','adapter','通过统一接口召回','该账号下的记忆查询'),
      S('adapter','hindsight','查询记忆引擎','引擎适配后的账号库与查询'),
      S('hindsight','adapter','返回相关事实','引擎原生事实 / 状态'),
      S('adapter','memory','转换为项目契约','MemoryFact：content、source_id、status'),
      S('memory','context','交回可用记忆','排除停用、待确认、已删、隐藏与不适用事实','data'),
      S('context','prompt','组织回答资料','问题 + 近期聊天 + 过滤后的记忆','data'),
      S('prompt','model','请求模型回答','回答模板 + 本轮消息'),
      S('model','ui','通过 API / SSE 流式返回','答案逐段显示；本轮没有修改笔记') ] },
    qa:{ foot:'全库问答只找当前账号笔记；跳过意图模型与个人记忆召回。没有可用来源时直接说明未找到，不编造笔记证据。', steps:[
      S('ui','api','在全库模式发送问题','mode=ask_notes + 问题 + 近期聊天'),
      S('api','router','采用程序固定计划','knowledge_base；跳过意图模型'),
      S('router','context','进入笔记问答','要求笔记证据与来源编号'),
      S('context','index','查找相关笔记片段','账号范围 + 查询问题'),
      S('index','db','读取检索数据','标题 / 词项 / 向量索引与有效来源','data'),
      S('db','index','返回候选片段','本人有效笔记的派生片段','data'),
      S('index','context','整理可用依据','融合排序后的片段 + 引用编号','data'),
      S('context','prompt','组织有依据的回答','问题 + 近期聊天 + 笔记片段','data'),
      S('prompt','model','请模型按资料回答','严格笔记回答与引用规则'),
      S('model','context','校验回答引用','核对引用编号，必要时修正输出'),
      S('context','ui','通过 API / SSE 返回','答案 + 可查看的笔记来源') ] },

      const expanded = isExpanded(id);
      detailPanels.get(id).hidden = !expanded;
      if(expanded)renderDetail(id);
      el.querySelector('button').setAttribute('aria-expanded',String(expanded));
      el.querySelector('[data-indicator]').textContent = expanded ? '−' : '＋';
    }
    fold.disabled = !state.expanded.size;
    layoutDetails();
  }
  function stop() {
    state.playing = false;
    clearTimeout(timer); timer = null;
    if(packetAnimation)cancelAnimationFrame(packetAnimation);
    packetAnimation=null;
  }
  function update() {
    chooser.value = state.scenario;
    const steps = getSteps();
    const selected = current();
    for(const id of state.expanded)renderDetail(id);
    root.classList.toggle('is-reading-route',!!selected);
    const included = new Set(steps.flatMap(s=>[s.from,s.to]));
    for (const [id,el] of nodeEls) {
      el.dataset.dim = String(state.scenario !== 'overview' && !included.has(id));
      if(selected?.to===id)el.dataset.receiving='true';else delete el.dataset.receiving;
    }
    play.disabled = !steps.length || !!selected?.waitForUser;
    previous.disabled = !steps.length || state.step<=0;
    next.disabled = !steps.length || state.step >= steps.length-1;
    mode.value = state.mode;
    speed.value = String(state.delayMs);
    play.hidden = state.mode!=='auto';
    speed.closest('label').hidden = state.mode!=='auto';
    play.textContent = selected?.waitForUser ? '等待确认' : state.playing ? '暂停' : state.step===steps.length-1 && steps.length ? '重新播放' : state.step>0?'继续播放':'开始播放';
    next.textContent = selected?.waitForUser ? '继续演示' : '下一步';
    count.textContent = !steps.length ? '全貌' : state.step<0 ? `路径 · ${steps.length} 步` : `${state.step+1} / ${steps.length}`;
    count.dataset.module=focusPoint()?.module||'';
    flowName.textContent = steps.length?chooser.selectedOptions[0].textContent:'';
    overviewStory.hidden=!!steps.length;
    board.hidden=!!steps.length;
    root.querySelector('#nf-map-legend').hidden=!!steps.length;
    root.querySelector('.map-controls').hidden=!steps.length;
    flowView.update(state);
    if(!selected){
      action.textContent=steps.length?'点击下一步，从第一步开始':'选择一个操作，沿着数据看';
      payload.textContent='每一步会交代数据从哪来、传了什么、到哪去。';
    }
    reading.textContent = selected?.waitForUser ? '等待用户确认'
      : state.step===steps.length-1 ? '本次操作结束'
      : state.mode==='manual' ? '单步阅读'
      : state.playing ? `自动播放 · 每步 ${state.delayMs/1000} 秒`
      : '自动播放已暂停';
    reading.hidden=!selected;
    foot.textContent = scenarios[state.scenario].foot;
    draw();
    root.dispatchEvent(new CustomEvent('nf:readerchange'));
  }
  function snapshot() { return new Map([...nodeEls].map(([id,el])=>[id,el.getBoundingClientRect()])); }
  function animateLayout(change) {
    if (layoutFrame) cancelAnimationFrame(layoutFrame);
    for (const el of nodeEls.values()) el.getAnimations().forEach(a=>a.cancel());
    const before = snapshot();
    change();
    if (reduced.matches || root.dataset.motion==='off') { draw(); return; }
    for (const [id,el] of nodeEls) {
      const after = el.getBoundingClientRect();
      const previous = before.get(id);
      if (previous && Math.abs(previous.top-after.top)+Math.abs(previous.left-after.left)>1) {
        el.animate([{transform:`translate(${previous.left-after.left}px,${previous.top-after.top}px)`},{transform:'translate(0,0)'}],{duration:360,easing:'cubic-bezier(.2,.8,.2,1)'});
      }
    }
    const started=performance.now();
    const tick=now=>{ draw(false); if(now-started<390) layoutFrame=requestAnimationFrame(tick); else {layoutFrame=null;draw();} };
    layoutFrame=requestAnimationFrame(tick);
  }
  function coords(id) {
    const b=board.getBoundingClientRect();
    const r=buttons.get(id).getBoundingClientRect();
    const section=nodeEls.get(id).getBoundingClientRect();
    return {x:r.left-b.left,y:section.top-b.top,w:r.width,h:section.height,cx:r.left-b.left+r.width/2,cy:r.top-b.top+r.height/2};
  }
  function panelRect(panel){const base=board.getBoundingClientRect(),r=panel.getBoundingClientRect();return{x:r.left-base.left,y:r.top-base.top,w:r.width,h:r.height};}
  function wrappedConnection(a,b,width,lane){
    const down=b.cy>a.cy;
    if(down){
      const startY=a.y+a.h+3,startTurn=startY+10,endY=b.y-5,endTurn=b.y-18;
      return `M ${a.cx} ${startY} Q ${a.cx} ${startTurn},${a.cx+Math.sign(lane-a.cx)*12} ${startTurn} L ${lane-Math.sign(lane-a.cx)*12} ${startTurn} Q ${lane} ${startTurn},${lane} ${startTurn+12} L ${lane} ${endTurn-12} Q ${lane} ${endTurn},${lane>width/2?lane-12:lane+12} ${endTurn} L ${b.cx-Math.sign(b.cx-lane)*12} ${endTurn} Q ${b.cx} ${endTurn},${b.cx} ${endY}`;
    }
    const startY=a.y-5,startTurn=a.y-18,endY=b.y+b.h+5,endTurn=endY+12;
    return `M ${a.cx} ${startY} Q ${a.cx} ${startTurn},${a.cx+Math.sign(lane-a.cx)*12} ${startTurn} L ${lane-Math.sign(lane-a.cx)*12} ${startTurn} Q ${lane} ${startTurn},${lane} ${startTurn-12} L ${lane} ${endTurn+12} Q ${lane} ${endTurn},${lane>width/2?lane-12:lane+12} ${endTurn} L ${b.cx-Math.sign(b.cx-lane)*12} ${endTurn} Q ${b.cx} ${endTurn},${b.cx} ${endY}`;
  }
  function drawDetails(){
    for(const[id,panel]of detailPanels){
      if(panel.hidden)continue;
      const canvas=panel.querySelector('.detail-canvas'),wires=canvas.querySelector('.detail-wires');
      const base=canvas.getBoundingClientRect();wires.setAttribute('viewBox',`0 0 ${canvas.clientWidth} ${canvas.clientHeight}`);wires.replaceChildren();
      const defs=make('defs');for(const status of ['future','complete','current']){
        const marker=make('marker',{id:`nf-detail-arrow-${id}-${status}`,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:5,markerHeight:5,orient:'auto'});
        marker.append(make('path',{d:'M 0 0 L 8 4 L 0 8 Z',class:`detail-arrow-${status}`}));defs.append(marker);
      }wires.append(defs);
      const points=[canvas.querySelector('[data-flow-port="input"]'),...canvas.querySelectorAll('[data-stage]'),canvas.querySelector('[data-flow-port="output"]')];
      const active=Number(panel.dataset.activeIndex);
      for(let i=0;i<points.length-1;i++){
        const ar=points[i].getBoundingClientRect(),br=points[i+1].getBoundingClientRect();
        const a={x:ar.left-base.left,y:ar.top-base.top,w:ar.width,h:ar.height},b={x:br.left-base.left,y:br.top-base.top,w:br.width,h:br.height};
        let d;
        if(Math.abs(a.y-b.y)<2){d=`M ${a.x+a.w+3} ${a.y+a.h/2} L ${b.x-5} ${b.y+b.h/2}`;}
        else{const mid=(a.y+a.h+b.y)/2;d=`M ${a.x+a.w/2} ${a.y+a.h+3} L ${a.x+a.w/2} ${mid} L ${b.x+b.w/2} ${mid} L ${b.x+b.w/2} ${b.y-5}`;}
        const status=active===i?'current':active>i?'complete':'future';
        wires.append(make('path',{d,class:`detail-line detail-line-${status}`,'marker-end':`url(#nf-detail-arrow-${id}-${status})`,'data-local-from':i,'data-local-to':i+1}));
      }
    }
  }
  function curve(s) {
    const a=coords(s.from), b=coords(s.to), width=board.clientWidth;
    const mobile=Number(getComputedStyle(grid).getPropertyValue('--map-columns'))===1;
    const sourceRow=nodes.find(n=>n.id===s.from).row;
    const targetRow=nodes.find(n=>n.id===s.to).row;
    if(s.from===s.to) {
      const x=a.x+a.w, y=a.cy;
      return `M ${x} ${y-12} C ${Math.min(width-2,x+22)} ${y-32},${Math.min(width-2,x+22)} ${y+32},${x} ${y+12}`;
    }
    const top=Math.min(a.y+a.h,b.y+b.h),bottom=Math.max(a.y,b.y);
    const blocked=[...detailPanels.values()].some(panel=>{if(panel.hidden)return false;const r=panelRect(panel);return r.y+r.h>top&&r.y<bottom;});
    if(blocked)return wrappedConnection(a,b,width,s.kind==='data'?8:width-5);
    if(mobile) {
      const sameNext = nodes.findIndex(n=>n.id===s.to)-nodes.findIndex(n=>n.id===s.from)===1;
      if(sameNext) return `M ${a.cx} ${a.y+a.h+3} L ${b.cx} ${b.y-5}`;
      const lane=s.kind==='data'?8:width-8;
      const ax=lane<width/2?a.x-3:a.x+a.w+3;
      const bx=lane<width/2?b.x-3:b.x+b.w+3;
      return `M ${ax} ${a.cy} C ${lane} ${a.cy},${lane} ${a.cy},${lane} ${a.cy+Math.sign(b.cy-a.cy)*14} L ${lane} ${b.cy-Math.sign(b.cy-a.cy)*14} Q ${lane} ${b.cy},${bx} ${b.cy}`;
    }
    const dbTarget=s.to==='db'||s.from==='db';
    if(dbTarget) {
      const down=s.to==='db', source=down?a:b, store=down?b:a;
      const sourceId=down?s.from:s.to;
      const lane = source.cx<width/3?12:source.cx>width*2/3||sourceId!=='runtime'?width-12:width/2;
      const endX = source.cx<width/3?store.x+store.w*.15:source.cx>width*2/3?store.x+store.w*.85:store.cx;
      const start={x:source.cx,y:source.y+source.h+3},end={x:endX,y:store.y-5};
      const d=`M ${start.x} ${start.y} C ${start.x} ${start.y+14},${lane} ${start.y+14},${lane} ${start.y+26} L ${lane} ${end.y-12} Q ${lane} ${end.y},${end.x} ${end.y}`;
      if(down) return d;
      return `M ${end.x} ${end.y} Q ${lane} ${end.y},${lane} ${end.y-12} L ${lane} ${start.y+26} C ${lane} ${start.y+14},${start.x} ${start.y+14},${start.x} ${start.y}`;
    }
    if(sourceRow===targetRow) {
      const right=b.cx>a.cx;
      return `M ${right?a.x+a.w+3:a.x-3} ${a.cy} L ${right?b.x-5:b.x+b.w+5} ${b.cy}`;
    }
    const down=b.cy>a.cy;
    const adjacent=Math.abs(sourceRow-targetRow)<=1;
    if(adjacent) {
      const x1=a.cx,y1=down?a.y+a.h+3:a.y-3,x2=b.cx,y2=down?b.y-5:b.y+b.h+5;
      const fromRowEdge=down
        ?Math.max(...nodes.filter(n=>n.row===sourceRow).map(n=>{const r=coords(n.id);return r.y+r.h;}))
        :Math.max(...nodes.filter(n=>n.row===targetRow).map(n=>{const r=coords(n.id);return r.y+r.h;}));
      const mid=down?(fromRowEdge+b.y)/2:(fromRowEdge+a.y)/2;
      return `M ${x1} ${y1} L ${x1} ${mid} C ${x1} ${mid},${x2} ${mid},${x2} ${y2}`;
    }
    return wrappedConnection(a,b,width,s.to==='ui'||s.from==='memory'||s.from==='hindsight'?width-5:5);
  }
  function draw(animatePacket=true) {
    if(board.hidden||!board.clientWidth) return;
    const selected=current();
    const steps=getSteps();
    const routeSet=new Set(steps.map(s=>`${s.from}|${s.to}`));
    const all=[...overview];
    for(const s of steps) if(!all.some(e=>e.from===s.from&&e.to===s.to)) all.push(s);
    const width=board.clientWidth,height=board.offsetHeight;
    const geometry=`${state.scenario}:${state.step}:${width}:${height}:`+[...nodeEls.keys()].map(id=>{
      const r=coords(id);return [r.x,r.y,r.w,r.h,r.cy].map(v=>Math.round(v*10)).join(',');
    }).join('|')+'::'+[...detailPanels].filter(([,panel])=>!panel.hidden).map(([id,panel])=>{const r=panelRect(panel);return `${id}/${panel.dataset.branch}/${[r.x,r.y,r.w,r.h].map(v=>Math.round(v*10)).join(',')}`;}).join('|');
    if(geometry===lastGeometry) return;
    lastGeometry=geometry;
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
    svg.replaceChildren();
    const defs=make('defs');
    for(const active of [false,true]) {
      const marker=make('marker',{id:`nf-map-arrow-${active?'active':'base'}`,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
      marker.append(make('path',{d:'M 0 0 L 8 4 L 0 8 Z',class:active?'wire-arrow-active':'wire-arrow'})); defs.append(marker);
    }
    svg.append(defs);
    for(const[id,panel]of detailPanels){
      if(panel.hidden)continue;const a=coords(id),b=panelRect(panel),x=Math.max(b.x+18,Math.min(a.cx,b.x+b.w-18));
      const blocked=[...detailPanels.values()].some(other=>{if(other===panel||other.hidden)return false;const r=panelRect(other);return r.y+r.h>a.y+a.h&&r.y<b.y;});
      const d=blocked?wrappedConnection(a,{...b,cx:x,cy:b.y},width,5):`M ${a.cx} ${a.y+a.h+3} L ${x} ${b.y-5}`;
      svg.append(make('path',{d,class:'wire-detail','data-detail-owner':id}));
    }
    const isCurrent=s=>!!selected&&selected.from===s.from&&selected.to===s.to;
    // Draw the selected connection last so shared outer lanes cannot hide it.
    const ordered=all.slice().sort((a,b)=>Number(isCurrent(a))-Number(isCurrent(b)));
    for(const s of ordered) {
      const inRoute=routeSet.has(`${s.from}|${s.to}`);
      const active=selected&&selected.from===s.from&&selected.to===s.to;
      const complete=!active&&steps.some((step,at)=>at<state.step&&step.from===s.from&&step.to===s.to);
      if(state.scenario!=='overview'&&!inRoute) continue;
      const d=curve(s);
      const path=make('path',{d,class:`${s.kind==='data'?'wire-data':''} ${inRoute?'wire-route':''} ${complete?'wire-complete':''} ${active?'wire-active':''}`,'data-from':s.from,'data-to':s.to,'marker-end':`url(#nf-map-arrow-${active?'active':'base'})`});
      svg.append(path);
      const info=active?selected:s;
      const hit=make('path',{d,class:'wire-hit cursor-interaction','data-tooltip':`${info.title}：${info.data}`});
      hit.addEventListener('click',()=>{
        if(state.scenario!=='overview') {
          const found=steps.findIndex(e=>e.from===s.from&&e.to===s.to);
          if(!active){stop();state.step=found;update();saveState();}
        } else { count.textContent='连线';action.textContent=s.title;payload.textContent=s.data; }
      });
      svg.append(hit);
      if(active) {
        path.dataset.activeWire='true';
        const length=path.getTotalLength();
        const key=`${state.scenario}:${state.step}`;
        const packet=make('circle',{r:4,class:'wire-packet'});
        const end=path.getPointAtLength(length);
        packet.setAttribute('cx',end.x);packet.setAttribute('cy',end.y);svg.append(packet);
        if(animatePacket&&!reduced.matches&&root.dataset.motion!=='off'&&key!==lastLineKey) {
          if(packetAnimation) cancelAnimationFrame(packetAnimation);
          const started=performance.now();
          const tick=now=>{
            if(!packet.isConnected) {packetAnimation=null;return;}
            const fraction=Math.min(1,(now-started)/1250);
            const p=path.getPointAtLength(length*(fraction*fraction*(3-2*fraction)));
            packet.setAttribute('cx',p.x);packet.setAttribute('cy',p.y);
            if(fraction<1) packetAnimation=requestAnimationFrame(tick); else packetAnimation=null;
          };
          packetAnimation=requestAnimationFrame(tick);
        }
      }
    }
    if(selected&&animatePacket) lastLineKey=`${state.scenario}:${state.step}`;
    drawDetails();
  }
  function advance() {
    if(state.step<getSteps().length-1) state.step++;
    if(state.step===getSteps().length-1 || current()?.waitForUser) stop();
    update();
  }
  function schedule() {
    clearTimeout(timer);
    timer=setTimeout(()=>{if(!state.playing)return;advance();if(state.playing)schedule();else saveState();},state.delayMs);
  }
  chooser.addEventListener('change',()=>{
    stop();state.scenario=chooser.value;state.step=getSteps().length?0:-1;lastLineKey='';update();saveState();
  });
  play.addEventListener('click',()=>{
    if(state.playing) {stop();update();saveState();return;}
    if(current()?.waitForUser) {stop();update();return;}
    if(state.step>=getSteps().length-1 || state.step<0) state.step=0;
    state.playing=true;update();schedule();saveState();
  });
  next.addEventListener('click',()=>{stop();advance();saveState();});
  previous.addEventListener('click',()=>{stop();if(state.step>0)state.step--;update();saveState();});
  mode.addEventListener('change',()=>{stop();state.mode=mode.value==='auto'?'auto':'manual';update();saveState();});
  speed.addEventListener('change',()=>{
    state.delayMs=[4000,6000,10000].includes(Number(speed.value))?Number(speed.value):6000;
    if(state.playing)schedule();update();saveState();
  });
  fold.addEventListener('click',()=>{stop();animateLayout(()=>{state.expanded.clear();updateExpanded();});update();saveState();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.playing){stop();update();}});
  new ResizeObserver(()=>{layoutDetails();draw(false);}).observe(board);
  reduced.addEventListener('change',()=>{if(packetAnimation)cancelAnimationFrame(packetAnimation);packetAnimation=null;draw(false);});
  root.addEventListener('nf:motionchange',()=>{
    if(root.dataset.motion==='off'){
      if(packetAnimation)cancelAnimationFrame(packetAnimation);
      packetAnimation=null;
      for(const el of nodeEls.values())el.getAnimations().forEach(animation=>animation.cancel());
      stop();update();
    }
  });
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&state.playing){stop();update();saveState();}
    if(event.target.closest('select,input,textarea,[contenteditable="true"]'))return;
    if(event.key==='ArrowRight'&&!next.disabled){event.preventDefault();next.click();}
    if(event.key==='ArrowLeft'&&!previous.disabled){event.preventDefault();previous.click();}
  });
  const flowView=window.NoteFlowOperationView.create({root,scenarios,nodes,details:detailData,selectStep:step=>{stop();state.step=step;update();saveState();}});
  if(window.lucide) window.lucide.createIcons({attrs:{width:16,height:16}});
  update();
  if(window.openai?.widgetState)restore(window.openai.widgetState);
})();
</script>
