      &lt;div class=&quot;nf-document-content&quot; id=&quot;nf-doc-body&quot;&gt;
        &lt;p&gt;Redis 是一个基于内存的键值数据库。它不仅能用来做缓存，也支持计数、排行榜和消息队列等常见场景。&lt;/p&gt;
        &lt;section id=&quot;nf-speed&quot;&gt;&lt;h2&gt;&lt;span class=&quot;nf-section-number&quot;&gt;1&lt;/span&gt;为什么这么快&lt;/h2&gt;
          &lt;div class=&quot;nf-selection-tools&quot; aria-label=&quot;选中文字的格式工具栏&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;nf-add-context cursor-interaction&quot; data-action=&quot;add-context&quot;&gt;&lt;i data-lucide=&quot;message-square-plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;添加到对话&lt;/button&gt;&lt;span class=&quot;nf-tool-divider&quot;&gt;&lt;/span&gt;

            &lt;button type=&quot;button&quot; class=&quot;nf-icon-button cursor-interaction&quot; data-format=&quot;ordered&quot; aria-label=&quot;有序列表&quot; data-tooltip=&quot;有序列表&quot;&gt;&lt;i data-lucide=&quot;list-ordered&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;nf-icon-button cursor-interaction&quot; data-format=&quot;quote&quot; aria-label=&quot;引用&quot; data-tooltip=&quot;引用&quot;&gt;&lt;i data-lucide=&quot;quote&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;nf-icon-button cursor-interaction&quot; data-action=&quot;clear-format&quot; aria-label=&quot;清除格式&quot; data-tooltip=&quot;清除格式&quot;&gt;&lt;i data-lucide=&quot;remove-formatting&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;

          &lt;div class=&quot;nf-selected-passage&quot;&gt;&lt;p&gt;它的高性能主要来自&lt;strong&gt;内存访问、紧凑的数据结构和高效的事件处理&lt;/strong&gt;。理解 Redis 时，不应把“单线程”当作唯一答案，也需要区分命令执行与网络 I/O。&lt;/p&gt;&lt;/div&gt;

            &lt;tr&gt;&lt;td&gt;String&lt;/td&gt;&lt;td&gt;缓存、计数器、简单的键值存储&lt;/td&gt;&lt;/tr&gt;

          &lt;p&gt;为缓存设置合适的过期时间，避免数据一直占用内存。&lt;/p&gt;
          &lt;pre class=&quot;nf-code-block&quot;&gt;&lt;code&gt;&lt;span class=&quot;nf-code-command&quot;&gt;SET&lt;/span&gt; user:1001:name &quot;Alice&quot; &lt;span class=&quot;nf-code-command&quot;&gt;EX&lt;/span&gt; 3600
&lt;span class=&quot;nf-code-command&quot;&gt;GET&lt;/span&gt; user:1001:name&lt;/code&gt;&lt;/pre&gt;

      &lt;div class=&quot;nf-chat&quot;&gt;
        &lt;div class=&quot;nf-user-message&quot;&gt;&lt;p&gt;能结合这段笔记，解释一下 Redis 的单线程和多线程 I/O 吗？&lt;/p&gt;&lt;span class=&quot;nf-attached-selection&quot;&gt;&lt;i data-lucide=&quot;quote&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;已引用 · Redis&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;nf-assistant-answer&quot;&gt;
          &lt;p class=&quot;nf-answer-title&quot;&gt;可以把它们理解为两个不同的层次。&lt;/p&gt;
          &lt;p&gt;“处理命令”和“收发网络数据”并不是同一件事，所以两种说法并不矛盾。&lt;/p&gt;
          &lt;ol class=&quot;nf-answer-list&quot;&gt;
            &lt;li&gt;&lt;span class=&quot;nf-answer-number&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;strong&gt;命令执行：主要串行处理&lt;/strong&gt;&lt;p&gt;常规命令主要在主线程执行，让数据结构的操作保持简单、可预测。&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span class=&quot;nf-answer-number&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;strong&gt;网络 I/O：可以并行分担&lt;/strong&gt;&lt;p&gt;多线程 I/O 可分担网络数据的读写，不意味着所有命令都并行执行。&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span class=&quot;nf-answer-number&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;strong&gt;性能：来自整条处理链路&lt;/strong&gt;&lt;p&gt;内存访问、数据结构、网络负载与命令复杂度，都影响实际响应速度。&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;

  &lt;div class=&quot;nf-menu nf-display-menu&quot; data-menu-panel=&quot;display&quot; aria-label=&quot;正文显示设置&quot; hidden&gt;&lt;div class=&quot;nf-menu-caption&quot;&gt;正文显示&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;toggle-numbers&quot; aria-pressed=&quot;true&quot;&gt;&lt;i data-lucide=&quot;list-ordered&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;隐藏章节编号&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;nf-menu nf-history-menu&quot; data-menu-panel=&quot;history&quot; aria-label=&quot;对话历史&quot; hidden&gt;&lt;input class=&quot;nf-history-search&quot; aria-label=&quot;搜索对话历史&quot; placeholder=&quot;搜索对话…&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-session=&quot;Redis 为什么快&quot;&gt;&lt;i data-lucide=&quot;message-circle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Redis 为什么快&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-session=&quot;缓存的过期策略&quot;&gt;&lt;i data-lucide=&quot;message-circle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;缓存的过期策略&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;new-chat&quot;&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;新建对话&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;nf-menu nf-mode-menu&quot; data-menu-panel=&quot;mode&quot; aria-label=&quot;AI 模式&quot; hidden&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-mode=&quot;对话&quot;&gt;&lt;i data-lucide=&quot;message-circle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;对话&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-mode=&quot;全库搜索&quot;&gt;&lt;i data-lucide=&quot;search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;全库搜索&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;nf-overlay&quot; data-overlay=&quot;search&quot; hidden&gt;&lt;section class=&quot;nf-search-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;搜索笔记&quot;&gt;&lt;div class=&quot;nf-search-dialog-top&quot;&gt;&lt;i data-lucide=&quot;search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;input placeholder=&quot;搜索笔记…&quot; aria-label=&quot;搜索内容&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;nf-icon-button cursor-interaction&quot; data-action=&quot;close-search&quot; aria-label=&quot;关闭搜索&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;nf-search-results&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;nf-search-result cursor-interaction&quot; data-note=&quot;Go 语言&quot;&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Go 语言&lt;small&gt;全栈开发&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;nf-search-result cursor-interaction&quot; data-note=&quot;AI应用开发学习笔记&quot;&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;AI应用开发学习笔记&lt;small&gt;全栈开发&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;nf-search-result cursor-interaction&quot; data-note=&quot;Redis&quot;&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Redis&lt;small&gt;全栈开发&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;nf-search-result cursor-interaction&quot; data-note=&quot;Python 的面试常问问题&quot;&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Python 的面试常问问题&lt;small&gt;全栈开发&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;nf-search-result cursor-interaction&quot; data-note=&quot;Git 入门学习笔记&quot;&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Git 入门学习笔记&lt;small&gt;全栈开发&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;nf-menu-caption nf-no-results&quot; hidden&gt;没有匹配的笔记&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;div class=&quot;nf-local-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; hidden&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;noteflow-soft-focus&#x27;);
  const q = (selector) =&gt; root.querySelector(selector);
  const all = (selector) =&gt; Array.from(root.querySelectorAll(selector));
  const prompt = q(&#x27;.nf-prompt-input&#x27;);
  const title = q(&#x27;.nf-title-input&#x27;);
  const state = { aiOpen: window.innerWidth &gt; 960, navOpen: window.innerWidth &gt; 650, numbers: true, mode: &#x27;对话&#x27;, note: &#x27;Redis&#x27;, selection: true };
  let stateRevision = 0;
  let statusTimer;
  function closeMenus() {
    all(&#x27;[data-menu-panel]&#x27;).forEach(el =&gt; { el.hidden = true; });
    all(&#x27;[data-menu]&#x27;).forEach(el =&gt; el.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;));
  }
  function render() {
    root.classList.toggle(&#x27;nf-ai-closed&#x27;, !state.aiOpen);
    root.classList.toggle(&#x27;nf-nav-closed&#x27;, !state.navOpen);
    q(&#x27;.nf-ai-wrap&#x27;).hidden = !state.aiOpen;
    q(&#x27;.nf-ai-launcher&#x27;).hidden = state.aiOpen;
    const navToggle = q(&#x27;.nf-nav-heading [data-action=&quot;toggle-nav&quot;]&#x27;);
    navToggle.setAttribute(&#x27;aria-label&#x27;, state.navOpen ? &#x27;收起目录&#x27; : &#x27;展开目录&#x27;);
    q(&#x27;.nf-mode-button span&#x27;).textContent = state.mode;
    prompt.placeholder = state.mode === &#x27;全库搜索&#x27; ? &#x27;向整个知识库提问…&#x27; : &#x27;使用 AI 处理各种任务…&#x27;;
    q(&#x27;[data-context=&quot;selection&quot;]&#x27;).hidden = !state.selection;
    all(&#x27;.nf-section-number&#x27;).forEach(el =&gt; { el.hidden = !state.numbers; });
    const numbersButton = q(&#x27;[data-action=&quot;toggle-numbers&quot;]&#x27;);
    numbersButton.setAttribute(&#x27;aria-pressed&#x27;, String(state.numbers));
    numbersButton.querySelector(&#x27;span&#x27;).textContent = state.numbers ? &#x27;隐藏章节编号&#x27; : &#x27;显示章节编号&#x27;;
  }
  function remember() {
    stateRevision++;
    if (window.openai &amp;&amp; typeof window.openai.setWidgetState === &#x27;function&#x27;) {
      window.openai.setWidgetState({ modelContent: { design: &#x27;NoteFlow V10 柔光工作台&#x27;, aiOpen: state.aiOpen, mode: state.mode }, privateContent: { ...state, revision: stateRevision } }).catch(() =&gt; {});
    }
  }
  function restore(saved) {
    if (!saved || !saved.privateContent) return;
    const previous = saved.privateContent;
    const incomingRevision = Number.isFinite(previous.revision) ? previous.revision : 0;
    if (incomingRevision &lt; stateRevision) return;
    stateRevision = incomingRevision;
    [&#x27;aiOpen&#x27;, &#x27;navOpen&#x27;, &#x27;numbers&#x27;, &#x27;selection&#x27;].forEach(key =&gt; { if (typeof previous[key] === &#x27;boolean&#x27;) state[key] = previous[key]; });
    if ([&#x27;对话&#x27;, &#x27;全库搜索&#x27;].includes(previous.mode)) state.mode = previous.mode;
    render();
  }
  function notify(message) {
    const status = q(&#x27;.nf-local-status&#x27;);
    status.textContent = message;
    status.hidden = false;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() =&gt; { status.hidden = true; }, 2800);
  }
  function selectNote(name) {
    state.note = name;
    all(&#x27;.nf-note-row&#x27;).forEach(row =&gt; {
      const link = row.querySelector(&#x27;[data-note]&#x27;);
      const active = link.dataset.note === name;
      row.classList.toggle(&#x27;is-active&#x27;, active);
      if (active) link.setAttribute(&#x27;aria-current&#x27;, &#x27;page&#x27;); else link.removeAttribute(&#x27;aria-current&#x27;);
    });
    title.value = name;
    q(&#x27;[data-context=&quot;note&quot;] &gt; span&#x27;).textContent = name;
    q(&#x27;[data-context=&quot;note&quot;]&#x27;).hidden = false;
    q(&#x27;[data-overlay=&quot;search&quot;]&#x27;).hidden = true;
    if (name === &#x27;Redis&#x27;) {
      q(&#x27;#nf-doc-body&#x27;).hidden = false;
      q(&#x27;.nf-heading-rail&#x27;).hidden = false;
    } else {
      q(&#x27;#nf-doc-body&#x27;).hidden = true;
      q(&#x27;.nf-heading-rail&#x27;).hidden = true;
      notify(&#x27;设计预览仅填充 Redis 示例正文；不会改动实际笔记。&#x27;);
    }
    render(); remember();
  }
  root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
    const button = event.target.closest(&#x27;button&#x27;);
    if (!button || !root.contains(button)) return;
    if (button.dataset.menu) {
      const panel = q(`[data-menu-panel=&quot;${button.dataset.menu}&quot;]`);
      const opening = panel.hidden;
      closeMenus(); panel.hidden = !opening;
      button.setAttribute(&#x27;aria-expanded&#x27;, String(opening));
      return;
    }
    if (button.dataset.note) { selectNote(button.dataset.note); closeMenus(); return; }
    if (button.dataset.mode) { state.mode = button.dataset.mode; render(); remember(); closeMenus(); return; }
    if (button.dataset.session) { q(&#x27;.nf-session-launcher span&#x27;).textContent = button.dataset.session; closeMenus(); notify(&#x27;已切换示例会话标题；对话内容仅用于排版预览。&#x27;); return; }
    if (button.dataset.section) {
      q(&#x27;[data-overlay=&quot;search&quot;]&#x27;).hidden = true;
      if (state.note !== &#x27;Redis&#x27;) selectNote(&#x27;Redis&#x27;);
      all(&#x27;.nf-heading-rail button&#x27;).forEach(el =&gt; el.classList.toggle(&#x27;is-current&#x27;, el.dataset.section === button.dataset.section));
      const section = q(`#${button.dataset.section}`);
      section.scrollIntoView({ behavior: window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches ? &#x27;auto&#x27; : &#x27;smooth&#x27;, block: &#x27;center&#x27; });
      return;
    }
    if (button.dataset.remove) {
      if (button.dataset.remove === &#x27;selection&#x27;) { state.selection = false; render(); } else q(&#x27;[data-context=&quot;note&quot;]&#x27;).hidden = true;
      remember(); return;
    }
    if (button.dataset.format) {
      const format = button.dataset.format;
      const paragraph = q(&#x27;.nf-selected-passage p&#x27;);
      const active = !button.classList.contains(&#x27;is-on&#x27;);
      button.classList.toggle(&#x27;is-on&#x27;, active); button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
      if (format === &#x27;bold&#x27;) paragraph.style.fontWeight = active ? &#x27;600&#x27; : &#x27;&#x27;;
      else if (format === &#x27;italic&#x27;) paragraph.style.fontStyle = active ? &#x27;italic&#x27; : &#x27;&#x27;;
      else if (format === &#x27;underline&#x27;) paragraph.style.textDecoration = active ? &#x27;underline&#x27; : &#x27;&#x27;;
      else if (format === &#x27;strike&#x27;) paragraph.style.textDecoration = active ? &#x27;line-through&#x27; : &#x27;&#x27;;
      else if (format === &#x27;quote&#x27;) paragraph.style.borderLeft = active ? &#x27;2px solid var(--nf-accent)&#x27; : &#x27;&#x27;;
