<div id="nf-unified-settings" aria-label="NoteFlow 账号入口与统一设置设计">
  <section class="nus-stage viz-dotted-background" aria-label="统一设置界面标本">
    <div class="nus-label">设置 · 分类在同一个界面切换</div>
    <div class="nus-window" aria-label="统一设置工作区">
      <aside class="nus-navigation">
        <div class="nus-brand">设置</div>
        <nav aria-label="设置分类">
          <button type="button" class="nus-nav cursor-interaction" data-page="account"><i data-lucide="user-round" aria-hidden="true"></i>账号与安全</button>
          <button type="button" class="nus-nav cursor-interaction" data-page="appearance"><i data-lucide="sun-moon" aria-hidden="true"></i>外观</button>
          <button type="button" class="nus-nav cursor-interaction" data-page="memory"><i data-lucide="sparkles" aria-hidden="true"></i>AI 与记忆</button>
          <button type="button" class="nus-nav cursor-interaction" data-page="data"><i data-lucide="database" aria-hidden="true"></i>数据管理</button>
        </nav>
      </aside>
      <main class="nus-content">
        <header class="nus-content-heading"><h2 data-heading>账号与安全</h2><button type="button" class="nus-close cursor-interaction" data-close-settings aria-label="关闭设置"><i data-lucide="x" aria-hidden="true"></i></button></header>
        <div class="nus-pages">
          <section data-panel="account" aria-label="账号与安全内容">
            <div class="nus-identity"><span class="nus-avatar">张</span><span class="nus-username">张成</span></div>
            <button type="button" class="nus-setting-row cursor-interaction" data-disclose="email" aria-expanded="false"><span class="nus-row-main"><i data-lucide="mail" aria-hidden="true"></i><span>登录邮箱</span></span><span class="nus-row-end">已验证<i data-lucide="chevron-down" aria-hidden="true"></i></span></button>
            <div class="nus-detail" data-detail="email" hidden>
              <label for="nus-email">登录邮箱地址</label><input id="nus-email" type="email" placeholder="name@example.com" autocomplete="off" aria-label="登录邮箱地址">

            </div>
            <button type="button" class="nus-setting-row cursor-interaction" data-disclose="devices" aria-expanded="false"><span class="nus-row-main"><i data-lucide="monitor-smartphone" aria-hidden="true"></i><span>登录设备</span></span><span class="nus-row-end">管理<i data-lucide="chevron-down" aria-hidden="true"></i></span></button>
            <div class="nus-detail nus-empty" data-detail="devices" hidden>暂无可管理的会话</div>
          </section>
          <section data-panel="appearance" aria-label="外观内容" hidden>
            <div class="nus-setting-row"><span class="nus-row-main"><i data-lucide="sun-moon" aria-hidden="true"></i><span>显示模式</span></span><span class="nus-segment"><button type="button" class="cursor-interaction" data-appearance="light">浅色</button><button type="button" class="cursor-interaction" data-appearance="dark">深色</button></span></div>
          </section>
          <section data-panel="memory" aria-label="AI 与记忆内容" hidden>
            <div class="nus-setting-row"><span class="nus-row-main"><i data-lucide="sparkles" aria-hidden="true"></i><span>长期记忆</span></span><button type="button" class="nus-switch cursor-interaction" data-memory aria-label="长期记忆" aria-pressed="true"><span></span></button></div>
            <button type="button" class="nus-setting-row cursor-interaction" data-disclose="memories" aria-expanded="false"><span class="nus-row-main">记忆管理</span><span class="nus-row-end">查看<i data-lucide="chevron-down" aria-hidden="true"></i></span></button>
            <div class="nus-detail nus-empty" data-detail="memories" hidden>暂无长期记忆</div>
          </section>
          <section data-panel="data" aria-label="数据管理内容" hidden>
            <button type="button" class="nus-setting-row cursor-interaction" data-preview="本稿不导出或读取真实笔记"><span class="nus-row-main"><i data-lucide="file-archive" aria-hidden="true"></i><span>导出笔记备份</span></span><i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
            <button type="button" class="nus-setting-row cursor-interaction" data-preview="本稿不导出或读取真实数据"><span class="nus-row-main"><i data-lucide="file-json" aria-hidden="true"></i><span>导出完整数据</span></span><i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
            <button type="button" class="nus-setting-row cursor-interaction" data-preview="本稿不选择或上传真实文件"><span class="nus-row-main"><i data-lucide="upload" aria-hidden="true"></i><span>导入笔记文件</span></span><i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
            <button type="button" class="nus-setting-row cursor-interaction" data-trash><span class="nus-row-main"><i data-lucide="trash" aria-hidden="true"></i><span>回收站</span></span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
          </section>
          <section data-panel="trash" aria-label="回收站内容" hidden><button type="button" class="nus-back cursor-interaction" data-page="data"><i data-lucide="chevron-left" aria-hidden="true"></i>数据管理</button><div class="nus-trash-empty"><i data-lucide="trash" aria-hidden="true"></i><span>回收站是空的</span></div></section>
        </div>
      </main>
    </div>
    <div class="nus-closed" hidden><button type="button" class="nus-small-button cursor-interaction" data-open-settings>打开设置</button></div>
  </section>
  <div class="nus-lower">
    <section class="nus-sample viz-dotted-background" aria-label="底部单一账号入口标本">

      <div class="nus-footer-stage">

          <button type="button" class="nus-menu-item cursor-interaction" data-trash><i data-lucide="trash" aria-hidden="true"></i>回收站</button>
          <div class="nus-divider"></div>
          <button type="button" class="nus-menu-item cursor-interaction" data-preview="本稿不会退出真实账号"><i data-lucide="log-out" aria-hidden="true"></i>退出登录</button>
        </div>

      </div>
    </section>
    <section class="nus-sample viz-dotted-background" aria-label="统一删除确认标本">
      <div class="nus-label">删除笔记 · 独立的轻量确认</div>
      <div class="nus-delete-stage">
        <div class="nus-note-row"><i data-lucide="file-text" aria-hidden="true"></i><span>Redis</span><button type="button" class="nus-close cursor-interaction" data-note-menu aria-label="Redis 的操作"><i data-lucide="ellipsis" aria-hidden="true"></i></button></div>
        <div class="nus-note-menu" hidden><button type="button" class="nus-menu-item cursor-interaction" data-open-delete><i data-lucide="trash" aria-hidden="true"></i>删除</button></div>
        <section class="nus-delete-confirm" role="dialog" aria-labelledby="nus-delete-title">
          <h3 id="nus-delete-title">删除「Redis」？</h3><p>笔记将移至回收站，可随时恢复。</p>
          <div class="nus-confirm-actions"><button type="button" class="nus-small-button cursor-interaction" data-cancel-delete>取消</button><button type="button" class="nus-small-button nus-danger cursor-interaction" data-confirm-delete>移至回收站</button></div>
        </section>
      </div>
    </section>
  </div>
  <div class="nus-status" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
  const root=document.getElementById('nf-unified-settings');
  const design='noteflow-unified-settings-v1';
  const pages=['account','appearance','memory','data','trash'];
  const labels={account:'账号与安全',appearance:'外观',memory:'AI 与记忆',data:'数据管理',trash:'回收站'};
  const defaults={revision:0,page:'account',settingsOpen:true,accountOpen:true,deleteOpen:true,email:false,devices:false,memories:false,memory:true,appearance:null};
  const valid=v=>v?.design===design&&Number.isSafeInteger(v.revision)&&v.revision>=0&&pages.includes(v.page)&&['settingsOpen','accountOpen','deleteOpen','email','devices','memories','memory'].every(k=>typeof v[k]==='boolean')&&[null,'light','dark'].includes(v.appearance);
  const unwrap=v=>v?.modelContent??v;
  const saved=unwrap(window.openai?.widgetState);
  const state=valid(saved)?{...defaults,...saved}:{...defaults};
  const geometry={radius:20,rowHeight:64};
  const account=root.querySelector('.nus-account-popup');account.id='nus-account-dialog';
  const confirm=root.querySelector('.nus-delete-confirm');
  const trigger=root.querySelector('[data-account]');
  const noteMenu=root.querySelector('.nus-note-menu');
  function render() {
    root.style.setProperty('--nus-radius',geometry.radius+'px');root.style.setProperty('--nus-row-height',geometry.rowHeight+'px');root.style.colorScheme=state.appearance??'';
    const settings=root.querySelector('.nus-window');settings.classList.toggle('is-open',state.settingsOpen);settings.inert=!state.settingsOpen;settings.setAttribute('aria-hidden',String(!state.settingsOpen));root.querySelector('.nus-closed').hidden=state.settingsOpen;
    root.querySelector('[data-heading]').textContent=labels[state.page];
    for(const panel of root.querySelectorAll('[data-panel]'))panel.hidden=panel.dataset.panel!==state.page;
    for(const button of root.querySelectorAll('.nus-nav')){if(button.dataset.page===(state.page==='trash'?'data':state.page))button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');}
    for(const button of root.querySelectorAll('[data-disclose]'))button.setAttribute('aria-expanded',String(state[button.dataset.disclose]));
    for(const detail of root.querySelectorAll('[data-detail]'))detail.hidden=!state[detail.dataset.detail];
    root.querySelector('[data-memory]').setAttribute('aria-pressed',String(state.memory));
    for(const button of root.querySelectorAll('[data-appearance]'))button.setAttribute('aria-pressed',String(button.dataset.appearance===(state.appearance??'light')));
    account.classList.toggle('is-open',state.accountOpen);account.inert=!state.accountOpen;account.setAttribute('aria-hidden',String(!state.accountOpen));trigger.setAttribute('aria-expanded',String(state.accountOpen));
    confirm.classList.toggle('is-open',state.deleteOpen);confirm.inert=!state.deleteOpen;confirm.setAttribute('aria-hidden',String(!state.deleteOpen));
  }
  function save(action){state.revision++;root.querySelector('.nus-status').textContent=action??'';const snapshot={design};for(const key of Object.keys(defaults))snapshot[key]=state[key];window.openai?.setWidgetState?.({modelContent:snapshot,privateContent:null})?.catch(()=>{});}
  function page(next){state.page=next;state.settingsOpen=true;const panel=root.querySelector('[data-panel="'+next+'"]');panel.classList.remove('nus-page-enter');render();void panel.offsetWidth;panel.classList.add('nus-page-enter');}
  render();
  root.addEventListener('click',event=>{
    const b=event.target.closest('button');if(!b||!root.contains(b))return;
    if(b.dataset.page){page(b.dataset.page);save();}
    else if(b.hasAttribute('data-account')){state.accountOpen=!state.accountOpen;render();save();}
    else if(b.hasAttribute('data-open-settings')){state.settingsOpen=true;state.accountOpen=false;render();root.querySelector('[data-close-settings]').focus();save();}
    else if(b.hasAttribute('data-close-settings')){state.settingsOpen=false;state.accountOpen=false;render();trigger.focus();save();}
    else if(b.hasAttribute('data-trash')){page('trash');state.accountOpen=false;render();save();}
    else if(b.dataset.disclose){const key=b.dataset.disclose;state[key]=!state[key];render();save();}
    else if(b.dataset.appearance){state.appearance=b.dataset.appearance;render();save();}
    else if(b.hasAttribute('data-memory')){state.memory=!state.memory;render();save('仅预览开关，不保存真实设置');}
    else if(b.hasAttribute('data-note-menu')){noteMenu.hidden=!noteMenu.hidden;}
    else if(b.hasAttribute('data-open-delete')){noteMenu.hidden=true;state.deleteOpen=true;render();root.querySelector('[data-cancel-delete]').focus();save();}
    else if(b.hasAttribute('data-cancel-delete')||b.hasAttribute('data-confirm-delete')){state.deleteOpen=false;render();root.querySelector('[data-note-menu]').focus();save(b.hasAttribute('data-confirm-delete')?'仅预览：未删除任何笔记':'');}
    else if(b.dataset.preview){root.querySelector('.nus-status').textContent=b.dataset.preview;}
  });
  root.addEventListener('keydown',event=>{if(event.key!=='Escape'||event.isComposing)return;noteMenu.hidden=true;if(confirm.contains(event.target)&&state.deleteOpen){state.deleteOpen=false;render();root.querySelector('[data-note-menu]').focus();save();}else if(account.contains(event.target)||event.target===trigger){state.accountOpen=false;render();trigger.focus();save();}else if(root.querySelector('.nus-window').contains(event.target)){state.settingsOpen=false;render();trigger.focus();save();}});
  window.addEventListener('openai:set_globals',event=>{const next=unwrap(event.detail?.globals?.widgetState);if(valid(next)&&next.revision>state.revision){for(const k of Object.keys(defaults))state[k]=next[k];render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.nus-window'),onChange:render});tweak.addSlider(geometry,'radius',{label:'统一圆角',min:16,max:24,step:1,unit:'px'});tweak.addSlider(geometry,'rowHeight',{label:'设置行高',min:56,max:72,step:2,unit:'px'});}
})();
</script>
