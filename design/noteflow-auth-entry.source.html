<style>
  #nf-auth-entry .nfa-page {
    --nfa-bg: light-dark(#fcfcfd, #191c21);
    --nfa-ink: light-dark(#252b33, #eceef2);
    --nfa-muted: light-dark(#626b77, #acb4c0);
    --nfa-field: light-dark(#f2f3f5, #282d35);
    --nfa-edge: light-dark(#e1e5eb, #3d4654);
    --nfa-hover: light-dark(#e8ebef, #343c47);
    --nfa-primary: light-dark(#29333e, #e6ebf1);
    --nfa-primary-text: light-dark(#ffffff, #202832);
    --nfa-white: light-dark(#ffffff, #272c34);
    --nfa-selected: light-dark(#ffffff, #3a4350);
    --nfa-error: light-dark(#b33b37, #ffada7);
    --nfa-radius: 12px;
    --nfa-width: 360px;
    color: var(--nfa-ink); background: var(--nfa-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.5; min-height: 850px;
    display: flex; flex-direction: column; position: relative;
    -webkit-font-smoothing: antialiased;
  }
  #nf-auth-entry .nfa-page *, #nf-auth-entry .nfa-page *::before, #nf-auth-entry .nfa-page *::after { box-sizing: border-box; }
  #nf-auth-entry .nfa-page [hidden] { display: none !important; }
  #nf-auth-entry .nfa-page button, #nf-auth-entry .nfa-page input { font-family: inherit; font-weight: 400; }
  #nf-auth-entry .nfa-page button { -webkit-tap-highlight-color: transparent; }
  #nf-auth-entry .nfa-header { display: flex; align-items: center; gap: 7px; padding: 26px 30px 0; font-size: 19px; font-weight: 500; letter-spacing: -.45px; }
  #nf-auth-entry .nfa-header img, #nf-auth-entry .nfa-form-brand img { flex: none; object-fit: contain; }
  #nf-auth-entry .nfa-main { flex: 1; display: grid; place-items: center; padding: 28px 28px 50px; }
  #nf-auth-entry .nfa-form { width: min(100%, var(--nfa-width)); margin: 0; }
  #nf-auth-entry .nfa-form-brand { display: none; }
  #nf-auth-entry .nfa-heading { min-height: 90px; }
  #nf-auth-entry .nfa-heading h1 { font-size: 28px; font-weight: 500; line-height: 1.35; letter-spacing: -.8px; margin: 0 0 10px; color: var(--nfa-ink); }
  #nf-auth-entry .nfa-heading p { font-size: 14px; line-height: 22px; margin: 0; color: var(--nfa-muted); }
  #nf-auth-entry .nfa-switch { display: grid; grid-template-columns: 1fr 1fr; position: relative; background: var(--nfa-field); border-radius: var(--nfa-radius); padding: 4px; height: 48px; margin-bottom: 27px; }
  #nf-auth-entry .nfa-switch-thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: calc(var(--nfa-radius) - 3px); background: var(--nfa-selected); box-shadow: 0 1px 3px light-dark(#26303e12, #0000002b); transition: transform 230ms cubic-bezier(.2,.8,.2,1); }
  #nf-auth-entry .nfa-form[data-mode="register"] .nfa-switch-thumb { transform: translateX(100%); }
  #nf-auth-entry .nfa-switch button { background: transparent; border: 0; padding: 0 12px; color: var(--nfa-muted); position: relative; font-size: 14px; border-radius: calc(var(--nfa-radius) - 3px); transition: color 150ms; }
  #nf-auth-entry .nfa-switch button[aria-pressed="true"] { color: var(--nfa-ink); font-weight: 500; }
  #nf-auth-entry .nfa-reset-nav { height: 48px; margin-bottom: 27px; display: flex; align-items: center; }
  #nf-auth-entry .nfa-fields { display: flex; flex-direction: column; gap: 20px; min-height: 172px; }
  #nf-auth-entry .nfa-field label { font-size: 13px; line-height: 20px; color: var(--nfa-ink); display: block; margin-bottom: 8px; }
  #nf-auth-entry .nfa-input-wrap { height: 48px; display: flex; align-items: center; gap: 11px; border: 1px solid var(--nfa-edge); background: var(--nfa-field); border-radius: var(--nfa-radius); padding: 0 14px; transition: background 150ms, border-color 150ms; min-width: 0; }
  #nf-auth-entry .nfa-input-wrap:focus-within { border-color: light-dark(#8090a5, #9aa9bf); background: var(--nfa-white); }
  #nf-auth-entry .nfa-input-wrap:has([aria-invalid="true"]) { border-color: var(--nfa-error); }
  #nf-auth-entry .nfa-input-wrap input { color: var(--nfa-ink); font-size: 16px; line-height: 24px; background: transparent; width: 100%; min-width: 0; border: 0; padding: 6px 0; border-radius: 3px; }
  #nf-auth-entry .nfa-input-wrap input::placeholder { color: var(--nfa-muted); opacity: 1; font-size: 16px; }
  #nf-auth-entry .nfa-page svg.lucide { width: 18px !important; height: 18px !important; stroke-width: 1.65px !important; flex: none; color: var(--nfa-muted); }
  #nf-auth-entry .nfa-code-row { display: grid; grid-template-columns: minmax(0,1fr) 116px; gap: 10px; }
  #nf-auth-entry .nfa-send { border: 1px solid var(--nfa-edge); background: var(--nfa-white); color: var(--nfa-ink); font-size: 13px; padding: 0 10px; min-height: 48px; border-radius: var(--nfa-radius); white-space: nowrap; font-variant-numeric: tabular-nums; transition: background 140ms, transform 100ms; }
  #nf-auth-entry .nfa-send:hover:not(:disabled) { background: var(--nfa-hover); }
  #nf-auth-entry .nfa-page button:active:not(:disabled) { transform: scale(.985); }
  #nf-auth-entry .nfa-page button:disabled { color: var(--nfa-muted); cursor: default; }
  #nf-auth-entry .nfa-text { border: 0; background: transparent; color: var(--nfa-muted); padding: 0 3px; font-size: 13px; min-height: 44px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: color 140ms; }
  #nf-auth-entry .nfa-text:hover { color: var(--nfa-ink); }
  #nf-auth-entry .nfa-label-row { display: flex; align-items: center; justify-content: space-between; height: 28px; }
  #nf-auth-entry .nfa-label-row label { margin: 0; align-self: flex-start; }
  #nf-auth-entry .nfa-label-row button { font-size: 12px; margin-top: -16px; }
  #nf-auth-entry .nfa-eye { background: transparent; border: 0; padding: 0; min-width: 44px; min-height: 44px; margin-right: -12px; display: grid; place-items: center; border-radius: 9px; }
  #nf-auth-entry .nfa-feedback { min-height: 58px; display: flex; align-items: center; padding: 8px 0; color: var(--nfa-muted); font-size: 12px; line-height: 18px; }
  #nf-auth-entry .nfa-feedback[data-error="true"] { color: var(--nfa-error); }
  #nf-auth-entry .nfa-submit { width: 100%; min-height: 48px; border: 0; border-radius: var(--nfa-radius); background: var(--nfa-primary); color: var(--nfa-primary-text); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; transition: filter 140ms, transform 100ms; }
  #nf-auth-entry .nfa-submit svg.lucide { color: inherit; width: 17px !important; height: 17px !important; }
  #nf-auth-entry .nfa-submit:hover { filter: brightness(1.06); }
  #nf-auth-entry .nfa-secondary { min-height: 66px; padding-top: 14px; text-align: center; display: grid; place-items: start center; }
  #nf-auth-entry .nfa-secondary p { margin: 8px 0 0; color: var(--nfa-muted); font-size: 12px; line-height: 20px; }
  #nf-auth-entry .nfa-preview { text-align: center; color: var(--nfa-muted); font-size: 11px; line-height: 18px; padding: 0 24px 22px; }
  #nf-auth-entry .nfa-spinner { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: nfa-spin 800ms linear infinite; }
  #nf-auth-entry .nfa-form[data-changing="true"] .nfa-heading, #nf-auth-entry .nfa-form[data-changing="true"] .nfa-fields { animation: nfa-change 180ms ease-out; }
  #nf-auth-entry .nfa-surface { --nfa-bg: light-dark(#f0f2f5, #171b21); }
  #nf-auth-entry .nfa-surface .nfa-main { padding: 42px 28px 36px; }
  #nf-auth-entry .nfa-surface .nfa-form { width: min(100%, calc(var(--nfa-width) + 80px)); padding: 30px 40px 20px; background: var(--nfa-white); border-radius: 24px; box-shadow: 0 8px 32px light-dark(#26354a0a, #00000018); }
  #nf-auth-entry .nfa-surface .nfa-form-brand { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 18px; font-weight: 500; margin: -2px 0 27px; letter-spacing: -.4px; }
  #nf-auth-entry .nfa-surface .nfa-heading { text-align: center; }
  @keyframes nfa-spin { to { transform: rotate(360deg); } }
  @keyframes nfa-change { from { opacity: .5; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 480px) {
    #nf-auth-entry .nfa-page { min-height: 850px; }
    #nf-auth-entry .nfa-header { padding: 21px 17px 0; }
    #nf-auth-entry .nfa-main { padding: 36px 24px 42px; }
    #nf-auth-entry .nfa-surface .nfa-main { padding: 36px 16px 30px; }
    #nf-auth-entry .nfa-surface .nfa-form { padding: 27px 20px 18px; border-radius: 20px; }
    #nf-auth-entry .nfa-heading h1 { font-size: 26px; }
    #nf-auth-entry .nfa-code-row { grid-template-columns: minmax(0,1fr) 108px; gap: 8px; }
    #nf-auth-entry .nfa-switch { height: 52px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #nf-auth-entry .nfa-page *, #nf-auth-entry .nfa-page *::before, #nf-auth-entry .nfa-page *::after { transition: none !important; animation: none !important; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('nf-auth-entry');
  const template = document.getElementById('nf-auth-template');
  const designId = 'noteflow-auth-entry-a';
  const controllers = [];
  const settings = { width: 360, radius: 12 };
  function save() {
    const view = controllers.map(c => ({mode: c.state.mode === 'reset' ? 'login' : c.state.mode, method: c.state.mode === 'reset' ? 'password' : c.state.method}));
    window.openai?.setWidgetState({modelContent: {design: designId, flow: '邮箱验证注册，无强制密码', views: view}, privateContent: {authEntry: {design: designId, revision: 1, views: view, width: settings.width, radius: settings.radius}}})?.catch(() => {});
  }
  root.querySelectorAll('.nfa-page').forEach((page, index) => {
    const form = template.content.firstElementChild.cloneNode(true);
    page.querySelector('.nfa-main').append(form);
    const q = selector => form.querySelector(selector);
    const inputs = {email: q('[data-input="email"]'), code: q('[data-input="code"]'), password: q('[data-input="password"]')};
    Object.entries(inputs).forEach(([name, input]) => {
      input.id = `nfa-${index}-${name}`;
      input.closest('.nfa-field').querySelector('label').htmlFor = input.id;
      input.setAttribute('aria-describedby', `nfa-${index}-feedback`);
    });
    q('.nfa-feedback').id = `nfa-${index}-feedback`;
    const state = {mode: 'login', method: 'code', sending: false, pending: false, seconds: 0, deadline: 0, interacted: false, password: '', timers: new Set()};
    form.addEventListener('input', () => {state.interacted = true;});
    form.addEventListener('click', () => {state.interacted = true;});
    const schedule = (fn, delay) => { const timer = setTimeout(() => {state.timers.delete(timer); fn();}, delay); state.timers.add(timer); };
    function feedback(text = '', field = '', error = false) {
      const node = q('.nfa-feedback');
      node.dataset.error = String(error);
      node.querySelector('span').textContent = text;
      node.querySelector('span').setAttribute('role', error ? 'alert' : 'status');
      Object.entries(inputs).forEach(([name, input]) => input.setAttribute('aria-invalid', String(name === field && error)));
    }
    function cancel(keepCooldown = false) {
      state.timers.forEach(clearTimeout); state.timers.clear();
      state.sending = false; state.pending = false;
      if (!keepCooldown) {state.seconds = 0; state.deadline = 0;}
      else if (state.deadline > Date.now()) countdown();
    }
    function render() {
      const reset = state.mode === 'reset', register = state.mode === 'register', password = state.method === 'password' && !reset && !register;
      form.dataset.mode = state.mode; form.dataset.method = state.method;
      q('h1').textContent = reset ? '重设密码' : register ? '开始你的笔记' : '欢迎回来';
      q('.nfa-heading p').textContent = reset ? '验证邮箱，为账号设置新密码。' : register ? '验证邮箱，创建你的 NoteFlow 账号。' : '登录 NoteFlow，继续你的笔记。';
      q('.nfa-switch').hidden = reset; q('.nfa-reset-nav').hidden = !reset;
      form.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === state.mode)));
      q('[data-field="code"]').hidden = password; inputs.code.disabled = password;
      q('[data-field="password"]').hidden = !password && !reset; inputs.password.disabled = !password && !reset;
      q('[data-action="reset"]').hidden = reset;
      q('[data-field="password"] label').textContent = reset ? '新密码' : '密码';
      inputs.password.autocomplete = reset ? 'new-password' : 'current-password';
      inputs.password.placeholder = reset ? '至少 8 位' : '你的密码';
      const send = q('[data-action="send"]');
      send.disabled = state.sending || state.pending || state.seconds > 0;
      send.textContent = state.sending ? '发送中…' : state.seconds ? `${state.seconds}s 后重发` : '获取验证码';
      q('.nfa-submit').setAttribute('aria-busy', String(state.pending));
      q('.nfa-submit-label').textContent = state.pending ? '取消等待' : reset ? '更新密码' : register ? '创建账号' : '登录';
      q('.nfa-submit svg, .nfa-submit i').toggleAttribute('hidden', state.pending);
      q('.nfa-spinner').hidden = !state.pending;
      q('[data-action="method"]').hidden = register || reset;
      q('[data-action="method"]').textContent = password ? '使用验证码登录' : '使用密码登录';
      q('.nfa-secondary p').hidden = !register;
    }
    function change(mode, method = state.method) {
      if (state.mode === 'login' && state.method === 'password') state.password = inputs.password.value;
      cancel(); state.mode = mode; state.method = method;
      inputs.code.value = ''; inputs.password.value = mode === 'login' && method === 'password' ? state.password : '';
      inputs.password.type = 'password'; q('[data-action="eye"]').setAttribute('aria-pressed', 'false'); q('[data-action="eye"]').setAttribute('aria-label', '显示密码');
      feedback(); render(); save();
      form.dataset.changing = 'false'; void form.offsetWidth; form.dataset.changing = 'true';
      schedule(() => {form.dataset.changing = 'false';}, 200);
    }
    form.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => {if (button.dataset.mode !== state.mode) change(button.dataset.mode);}));
    q('[data-action="method"]').addEventListener('click', () => change('login', state.method === 'code' ? 'password' : 'code'));
    q('[data-action="reset"]').addEventListener('click', () => {change('reset', 'code'); inputs.email.focus();});
    q('[data-action="back"]').addEventListener('click', () => {change('login', 'password'); q('[data-action="reset"]').focus();});
    q('[data-action="eye"]').addEventListener('click', event => {
      const show = inputs.password.type === 'password'; inputs.password.type = show ? 'text' : 'password';
      event.currentTarget.setAttribute('aria-pressed', String(show)); event.currentTarget.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    });
    inputs.email.addEventListener('input', () => {cancel(); inputs.code.value = ''; feedback(); render();});
    [inputs.code, inputs.password].forEach(input => input.addEventListener('input', () => {if (state.pending) {cancel(true); render();} feedback();}));
    function emailOK() {if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(inputs.email.value.trim())) {feedback('请输入有效的邮箱地址。', 'email', true); return false;} return true;}
    function countdown() {
      state.seconds = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
      render(); if (state.seconds > 0) schedule(countdown, 1000);
    }
    q('[data-action="send"]').addEventListener('click', () => {
      if (!emailOK() || state.sending || state.seconds || state.pending) return;
      feedback('正在演示发送状态…'); state.sending = true; render();
      schedule(() => {state.sending = false; state.deadline = Date.now() + 60000; const purpose = state.mode === 'reset' ? '重设密码' : state.mode === 'register' ? '注册' : '登录'; feedback(`演示：${purpose}验证码发送状态，未实际发邮件。`); render(); countdown();}, 650);
    });
    function submitPreview() {
      if (state.pending) {cancel(true); feedback('已取消预览，输入仍保留。'); render(); return;}
      if (state.sending) {feedback('请等待发送状态结束。'); return;}
      if (!emailOK()) return;
      if (!inputs.code.disabled && !/^\d{6}$/.test(inputs.code.value)) {feedback('请输入 6 位数字验证码。', 'code', true); return;}
      if (!inputs.password.disabled && inputs.password.value.length < (state.mode === 'reset' ? 8 : 6)) {feedback(state.mode === 'reset' ? '新密码至少需要 8 位。' : '请输入至少 6 位的密码。', 'password', true); return;}
      feedback('正在演示验证状态…'); state.pending = true; render();
      schedule(() => {state.pending = false; feedback('预览完成，未登录或更改任何真实账号。'); render();}, 900);
    }
    q('.nfa-submit').addEventListener('click', submitPreview);
    // The host intentionally blocks native form submission; Enter stays local.
    form.addEventListener('submit', event => {event.preventDefault();});
    form.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing && event.target.matches('input')) {event.preventDefault(); submitPreview();}
    });
    render();
    controllers.push({state, change, cancel, render, feedback, page, form});
  });
  function style() {
    settings.width = Math.max(330, Math.min(400, Number(settings.width) || 360));
    settings.radius = Math.max(9, Math.min(16, Number(settings.radius) || 12));
    controllers.forEach(c => {c.page.style.setProperty('--nfa-width', `${settings.width}px`); c.page.style.setProperty('--nfa-radius', `${settings.radius}px`);});
  }
  function restore(snapshot) {
    const saved = snapshot?.privateContent?.authEntry;
    if (!saved || saved.design !== designId || saved.revision !== 1) return;
    if (Number.isFinite(saved.width)) settings.width = saved.width;
    if (Number.isFinite(saved.radius)) settings.radius = saved.radius;
    if (Array.isArray(saved.views)) saved.views.forEach((view, index) => {
      const c = controllers[index]; if (!c || c.state.interacted || !['login','register'].includes(view?.mode) || !['code','password'].includes(view?.method)) return;
      if (c.state.mode !== view.mode || c.state.method !== view.method) {
        c.cancel(); c.form.querySelector('[data-input="code"]').value = '';
        c.form.querySelector('[data-input="password"]').type = 'password';
        c.form.querySelector('[data-action="eye"]').setAttribute('aria-pressed', 'false');
        c.form.querySelector('[data-action="eye"]').setAttribute('aria-label', '显示密码');
        c.feedback();
      }
      c.state.mode = view.mode; c.state.method = view.method; c.render();
    });
    style();
  }
  restore(window.openai?.widgetState); style();
  window.addEventListener('openai:set_globals', event => {if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);});
  if (globalThis.Tweak) {
    const tweak = new Tweak({container: root, onChange: () => {style(); save();}});
    tweak.addSlider(settings, 'width', {label: '表单宽度', min: 330, max: 400, step: 10, unit: 'px'});
    tweak.addSlider(settings, 'radius', {label: '控件圆角', min: 9, max: 16, unit: 'px'});
  }
})();
</script>
