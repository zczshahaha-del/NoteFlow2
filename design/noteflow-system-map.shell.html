<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>NoteFlow · 系统架构</title>
  <style>
    :root {
      color-scheme:light dark; --font-size-base:14px;
      --background:#f5f7f9; --foreground:#26333f; --card:#fff; --card-foreground:#26333f;
      --popover:#fff; --popover-foreground:#26333f; --primary:#355f79; --primary-foreground:#fff;
      --secondary:#edf2f6; --secondary-foreground:#35516a; --muted:#edf1f4; --muted-foreground:#677581;
      --accent:#eaf3f8; --accent-foreground:#355f79; --border:#dfe6ec; --ring:#5289aa;
      --viz-series-1:#4c88ad; --surface:#fff; --canvas:#f9fbfc; --dot:#d8e1e7;
      --shadow:0 2px 6px #22394f04,0 10px 28px #22394f06;
    }
    @media(prefers-color-scheme:dark) {
      :root { --background:#11191f; --foreground:#e2eaf0; --card:#1a252e; --card-foreground:#e2eaf0;
        --popover:#1a252e; --popover-foreground:#e2eaf0; --primary:#85b5d1; --primary-foreground:#122430;
        --secondary:#24333f; --secondary-foreground:#b3cedf; --muted:#23313b; --muted-foreground:#9aabb7;
        --accent:#223b4b; --accent-foreground:#b6d7e9; --border:#30414e; --ring:#85b5d1;
        --viz-series-1:#85b5d1; --surface:#17222a; --canvas:#131e26; --dot:#2a3944;
        --shadow:0 2px 6px #0001,0 10px 28px #0002; }
    }
    * {box-sizing:border-box}
    body {margin:0;background:var(--background);color:var(--foreground);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button,select {font:inherit}
    button {cursor:pointer}
    button:disabled {cursor:default;opacity:.45}
    button:focus-visible,select:focus-visible,summary:focus-visible {outline:3px solid var(--ring);outline-offset:3px}
    h1,h2,p {margin:0}
    .site-bar {height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid var(--border);background:var(--surface);gap:20px}
    .site-brand {display:flex;align-items:center;gap:12px;font-size:18px;font-weight:650;letter-spacing:-.5px}
    .brand-mark {width:30px;height:30px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;transform:rotate(-7deg)}
    .brand-mark i {border-radius:4px;background:var(--primary)}
    .brand-mark i:nth-child(2) {opacity:.55}.brand-mark i:nth-child(3) {opacity:.3}
    .bar-divider {height:20px;width:1px;background:var(--border);margin:0 5px}
    .bar-label {font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted-foreground)}
    .bar-actions {display:flex;align-items:center;gap:20px;font-size:12px;color:var(--muted-foreground)}
    .motion-toggle {border:1px solid var(--border);background:var(--surface);border-radius:30px;padding:8px 14px;display:flex;gap:8px;align-items:center;color:var(--foreground);font-size:12px}
    .motion-lamp {width:6px;height:6px;border-radius:50%;background:var(--viz-series-1);box-shadow:0 0 0 4px color-mix(in srgb,var(--viz-series-1) 10%,transparent)}
    .atlas-layout {max-width:1660px;margin:auto;display:grid;grid-template-columns:226px minmax(0,1fr);min-height:calc(100vh - 72px)}
    .scenario-sidebar {border-right:1px solid var(--border);padding:36px 18px 26px;align-self:start;position:sticky;top:0;display:flex;flex-direction:column;gap:28px}
    .sidebar-caption {padding:0 14px;font-size:11px;color:var(--muted-foreground);letter-spacing:1.5px;margin-bottom:12px}
    .scenario-list {display:grid;gap:6px}
    .scenario-link {border:0;background:transparent;border-radius:11px;padding:12px 14px;display:flex;align-items:center;gap:11px;text-align:left;color:var(--muted-foreground);width:100%;transition:background .2s,color .2s}
    .scenario-link:hover {background:var(--muted);color:var(--foreground)}
    .scenario-link[aria-current="true"] {background:var(--accent);color:var(--accent-foreground);font-weight:600}
    .nav-symbol {font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;width:20px;flex-shrink:0;color:var(--muted-foreground)}
    .scenario-link[aria-current="true"] .nav-symbol {color:var(--accent-foreground)}
    .sidebar-note {padding:18px 14px 0;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground);display:grid;gap:10px}
    .sidebar-note strong {color:var(--foreground);font-weight:500}
    .atlas-workspace {min-width:0;padding:38px 36px 30px}
    .page-hero {display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:26px}
    .eyebrow {font-size:10px;letter-spacing:2px;color:var(--muted-foreground);margin-bottom:8px;font-weight:600}
    h1 {font-size:29px;letter-spacing:-1px;font-weight:650;line-height:1.3}
    .hero-description {font-size:13px;color:var(--muted-foreground);margin-top:9px}
    .hero-note {font-size:11px;color:var(--muted-foreground);border:1px solid var(--border);padding:7px 11px;border-radius:30px;white-space:nowrap;background:var(--surface)}
    #nf-system-map .map-heading {display:none}
    #nf-system-map {--map-active:#b85d14}
    #nf-system-map .map-scenario-controls {display:none}
    #nf-system-map .map-reader {position:sticky;top:12px;z-index:5;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
    #nf-system-map .map-controls {display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}
    #nf-system-map .map-controls>.form-label {display:none}
    #nf-system-map .map-reader .map-controls {margin:0 0 12px}
    #nf-system-map .map-step-controls {width:100%}
    #nf-system-map .map-step-controls>.form-label {display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted-foreground)}
    #nf-system-map .map-step-controls .form-select {width:auto;margin:0;padding:8px 10px;font-size:12px;min-height:38px}
    .viz-row {display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .btn {border:1px solid var(--border);background:var(--surface);color:var(--foreground);border-radius:9px;padding:9px 14px;transition:box-shadow .2s,border-color .2s,background .2s;min-height:38px}
    .btn:not(:disabled):hover {background:var(--muted);border-color:var(--muted-foreground)}
    .btn-primary {background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);font-weight:500}
    .btn-primary:not(:disabled):hover {background:color-mix(in srgb,var(--primary) 90%,var(--foreground));border-color:var(--primary)}
    .btn-ghost {border-color:transparent;background:transparent;color:var(--muted-foreground)}
    .text-small {font-size:12px}.text-muted {color:var(--muted-foreground)}
    .tabular-nums {font-variant-numeric:tabular-nums}
    .form-select {display:block;width:100%;max-width:100%;padding:10px 12px;background:var(--surface);color:var(--foreground);border:1px solid var(--border);border-radius:9px;margin-top:8px;font-size:14px}
    #nf-system-map .map-position {position:relative;background:var(--surface);border:1px solid var(--border);border-radius:13px;min-height:0;padding:14px 18px;gap:4px;margin-bottom:15px;box-shadow:var(--shadow)}
    #nf-system-map .map-reader .map-position {border:0;border-radius:0;box-shadow:none;padding:0;margin:0;gap:8px}
    .map-reading-live {display:grid;gap:10px}
    .map-step-meta {display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--primary);font-size:12px;font-weight:600}
    #nf-map-count {color:var(--muted-foreground);white-space:nowrap}
    #nf-map-action {font-weight:600;font-size:15px}
    #nf-map-payload {margin-top:4px;color:var(--muted-foreground);font-size:13px}
    #nf-map-next,#nf-map-play {min-width:86px}
    #nf-map-reading {font-size:11px;color:var(--muted-foreground);font-weight:400;margin-left:auto}
    .flow-phases {display:flex;gap:8px;margin-bottom:18px}
    .flow-phases>button {flex:1;min-width:0;position:relative;display:flex;align-items:center;gap:9px;padding:13px 12px;border:1px solid var(--border);border-radius:12px;color:var(--muted-foreground);background:var(--surface);text-align:left;transition:border-color .2s,background .2s}
    .flow-phases>button[aria-current="true"] {color:var(--primary);border-color:var(--primary);background:var(--accent)}
    .flow-phases>button[data-complete="true"] .flow-phase-number {background:var(--accent);color:var(--primary)}
    .flow-phase-number {display:grid;place-items:center;flex:none;width:27px;height:27px;border-radius:50%;background:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
    .flow-phases>button[aria-current="true"] .flow-phase-number {background:var(--primary);color:var(--primary-foreground)}
    .flow-phases strong {display:block;font-size:12px;font-weight:600}
    .flow-phases small {display:block;font-size:10px;margin-top:2px}
    .flow-phase-arrow {margin-left:auto;font-size:15px}
    .flow-phases>button:last-child .flow-phase-arrow {display:none}
    .flow-stage {padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
    .flow-stage-heading {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
    .flow-stage-heading h3 {margin:0;font-size:17px;font-weight:600}
    .flow-stage-heading p {margin-top:3px;font-size:12px;color:var(--muted-foreground)}
    .flow-stage-count {font-size:10px;color:var(--muted-foreground);white-space:nowrap}
    .flow-stage-layout {display:grid;grid-template-columns:minmax(0,1fr) minmax(235px,.65fr);gap:20px;align-items:start}
    .flow-graph-column {min-width:0}
    .flow-diagram {position:relative;padding:32px 42px;background:var(--canvas);background-image:radial-gradient(var(--dot) .6px,transparent .6px);background-size:18px 18px;border:1px solid var(--border);border-radius:13px;min-height:calc(var(--flow-max-rows) * 88px + (var(--flow-max-rows) - 1) * 56px + 64px)}
    .flow-nodes {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 62px;align-items:start}
    .flow-node {position:relative;z-index:1;display:flex;align-items:center;justify-content:start;gap:9px;width:100%;height:88px;min-width:0;padding:12px;background:var(--surface);color:var(--foreground);border:1px solid var(--border);border-radius:10px;box-shadow:0 3px 12px #22394f05;text-align:left}
    .flow-node svg {width:20px;height:20px;flex-shrink:0;color:var(--viz-series-1)}
    .flow-node>span {font-size:12px;font-weight:600;overflow-wrap:anywhere}
    .flow-node small {display:block;font-weight:400;font-size:9px;color:var(--muted-foreground);margin-top:4px}
    .flow-node[data-active="true"] {border-color:var(--map-active);box-shadow:0 0 0 2px color-mix(in srgb,var(--map-active) 10%,transparent)}
    .flow-node[data-active="true"] svg {color:var(--map-active)}
    .flow-wires {position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .flow-edge {fill:none;stroke:var(--border);stroke-width:1.5;stroke-linejoin:round}
    .flow-edge-done {stroke:var(--viz-series-1)}
    .flow-edge-current {stroke:var(--map-active);stroke-width:2.6}
    .flow-edge-component {stroke-dasharray:4 3}
    .flow-edge-hit {fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
    .flow-arrow-base {fill:var(--muted-foreground)}
    .flow-arrow-done {fill:var(--viz-series-1)}
    .flow-arrow-current,.flow-packet {fill:var(--map-active)}
    .flow-edge-label {cursor:pointer;font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .flow-edge-label rect {fill:var(--surface);stroke:var(--border)}
    .flow-edge-label text {fill:var(--muted-foreground)}
    .flow-edge-label [aria-current="step"] rect {fill:var(--map-active);stroke:var(--map-active)}
    .flow-edge-label [aria-current="step"] text {fill:var(--surface);font-weight:600}
    .flow-edge-label [role="button"]:focus {outline:2px solid var(--ring);outline-offset:3px}
    .flow-wire-legend {display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted-foreground);margin:10px 2px 16px}
    .flow-wire-legend i {width:18px;border-top:2px solid var(--map-active)}
    .flow-wire-legend>span {margin-left:auto}
    .flow-step-list {display:grid;gap:5px}
    .flow-step-list>button {display:flex;align-items:center;gap:8px;min-height:34px;padding:6px 9px;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--muted-foreground);font-size:11px;text-align:left}
    .flow-step-list>button>span {width:20px;flex:none;font-size:10px;font-variant-numeric:tabular-nums}
    .flow-step-list>button[aria-current="true"] {background:var(--accent);border-color:var(--border);color:var(--primary);font-weight:600}
    .flow-step-list i {margin-left:auto;font-size:7px;font-style:normal;color:var(--map-active)}
    .flow-inspector-stack {display:grid;min-width:0;position:sticky;top:148px}
    .flow-inspector {grid-area:1/1;min-width:0}
    .flow-inspector[aria-hidden="true"] {visibility:hidden}
    .flow-inspector-meta {display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--primary);font-size:11px}
    .flow-wait-tag {border:1px solid color-mix(in srgb,var(--map-active) 25%,var(--border));border-radius:5px;padding:2px 5px;color:var(--map-active);font-size:10px}
    .flow-inspector h3 {font-size:18px;line-height:1.45;margin:10px 0 7px;letter-spacing:-.3px}
    .flow-transfer {display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted-foreground);padding-bottom:18px}
    .flow-transfer>span:nth-child(2) {color:var(--map-active)}
    .flow-data-label {display:block;font-size:10px;color:var(--muted-foreground);margin-bottom:5px}
    .flow-data-in,.flow-treatment {padding:13px 0;border-top:1px solid var(--border)}
    .flow-inspector p {font-size:13px;line-height:1.65;overflow-wrap:anywhere}
    .flow-data-out {margin-top:4px;padding:13px;border-radius:10px;background:var(--accent);color:var(--accent-foreground)}
    .flow-data-out .flow-data-label {color:var(--primary)}
    .flow-data-out dl {display:grid;gap:7px;margin:12px 0 0;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--primary) 15%,transparent)}
    .flow-data-out dl>div {display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:11px}
    .flow-data-out dt {color:var(--muted-foreground)}
    .flow-data-out dd {margin:0;overflow-wrap:anywhere}
    #nf-system-map.is-reading-route .map-reader {display:flex;align-items:center;justify-content:space-between;gap:16px}
    #nf-system-map.is-reading-route .map-reader .map-controls {margin:0}
    #nf-system-map.is-reading-route .map-step-meta {gap:12px}
    #nf-system-map.is-reading-route .map-position {flex:1}
    .flow-implementation {border-top:1px solid var(--border);margin-top:20px;padding-top:12px;color:var(--muted-foreground)}
    .flow-implementation summary {font-size:11px;cursor:pointer}
    .flow-implementation p {font-size:11px;margin:10px 0}
    .flow-implementation small {display:block;margin:10px 0 5px;font-size:10px}
    .flow-implementation code {display:block;font:10px/1.7 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}
    @media(max-width:1100px) {
      #nf-system-map.is-reading-route .map-reader {display:block}
      #nf-system-map.is-reading-route .map-reader .map-controls {margin-bottom:10px}
      .flow-stage {padding:16px}
      .flow-stage-layout {grid-template-columns:minmax(0,1fr) minmax(210px,.6fr);gap:16px}
      .flow-node {flex-direction:column;align-items:start;justify-content:center;gap:4px;padding:9px}
      .flow-node small {font-size:8px}
      .flow-node svg {width:17px;height:17px}
      .flow-diagram {padding-inline:32px}
      .flow-nodes {column-gap:44px}
      .flow-phases>button {padding:10px 8px;gap:6px}
      .flow-phase-number {width:23px;height:23px}
      .flow-phase-arrow {display:none}
    }
    @media(max-width:820px) {
      .flow-stage-layout {grid-template-columns:minmax(0,1fr) minmax(220px,.65fr)}
    }
    @media(max-width:680px) {
      .flow-stage-layout {grid-template-columns:1fr}
      .flow-graph-column {display:contents}
      .flow-diagram {order:0}
      .flow-wire-legend {order:1;margin:0}
      .flow-inspector-stack {position:relative;top:0;order:2}
      .flow-step-list {order:3}
      .flow-phases {display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
      .flow-phases strong {font-size:11px}
      .flow-stage {padding:14px;border-radius:13px}
      .flow-stage-count {font-size:9px}
      .flow-stage-heading h3 {font-size:15px}
      .flow-node {flex-direction:row;align-items:center;padding:10px;gap:8px}
      .flow-diagram {padding-inline:32px}
      .flow-node small {font-size:9px}
      .flow-step-list {grid-template-columns:repeat(2,minmax(0,1fr))}
      .flow-step-list>button {font-size:10px;min-height:44px}
      .flow-inspector h3 {font-size:17px}
    }
    @media(max-width:380px) {
      .flow-node {flex-direction:column;align-items:start;gap:4px;padding:7px}
      .flow-node>span {font-size:11px}
      .flow-node small {display:none}
      .flow-stage-heading {gap:6px}
      .flow-stage-heading p {font-size:11px}
      .flow-stage-count {white-space:normal;max-width:44px}
      .flow-step-list {grid-template-columns:1fr}
    }
    #nf-system-map .map-legend {gap:12px 22px;font-size:11px;margin:0 0 20px;padding:0 3px}
    #nf-system-map .map-board {background-color:var(--canvas);background-image:radial-gradient(var(--dot) .7px,transparent .7px);background-size:18px 18px;border:1px solid var(--border);border-radius:20px;padding:22px 8px 18px;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--surface) 70%,transparent)}
    #nf-system-map .map-grid {column-gap:24px;row-gap:36px;padding:8px 24px 12px}
    #nf-system-map .map-node {gap:8px}
    #nf-system-map .map-node[data-span="all"] {max-width:520px;width:65%}
    #nf-system-map .map-node[data-node="db"] {max-width:none;width:100%}
    #nf-system-map .map-node-meta {font-size:11px;gap:6px;color:var(--muted-foreground);padding:0 5px;align-items:center}
    #nf-system-map [data-indicator] {font-size:14px;color:var(--muted-foreground)}
    #nf-system-map .viz-tile {width:100%;padding:15px 16px 14px;min-height:91px;border:1px solid var(--border);border-radius:13px;background:var(--surface);text-align:left;box-shadow:var(--shadow);position:relative;font-size:14px;font-weight:600;color:var(--foreground);overflow:hidden}
    #nf-system-map .viz-tile>span {display:block;padding-top:24px;position:relative}
    #nf-system-map .viz-tile .text-small {font-size:11px;font-weight:400;color:var(--muted-foreground);display:inline-block;margin-top:3px}
    #nf-system-map .viz-tile:hover {border-color:color-mix(in srgb,var(--viz-series-1) 55%,var(--border));background:var(--surface);box-shadow:0 4px 20px color-mix(in srgb,var(--viz-series-1) 11%,transparent)}
    #nf-system-map .map-node[data-receiving] .viz-tile {border-color:var(--map-active)}
    #nf-system-map .map-node[data-node="db"] .viz-tile {background:color-mix(in srgb,var(--accent) 50%,var(--surface))}
    #nf-system-map .map-inner {background:var(--surface);border-left:2px solid color-mix(in srgb,var(--viz-series-1) 35%,var(--border));padding:14px 12px;border-radius:0 8px 8px 0;font-size:12px;gap:14px;box-shadow:var(--shadow)}
    #nf-system-map .map-inner ol {gap:9px;padding-left:17px}
    #nf-system-map .map-inner summary {font-size:11px;cursor:pointer}
    #nf-system-map .map-source {font-size:11px;gap:8px;line-height:1.6}
    #nf-system-map .map-source code {font:11px/1.6 ui-monospace,SFMono-Regular,monospace;color:var(--muted-foreground)}
    #nf-system-map .module-detail {display:block;padding:22px;border:1px solid var(--border);border-radius:15px;background:var(--surface);box-shadow:var(--shadow);animation:detail-enter .28s ease-out;overflow-wrap:anywhere}
    #nf-system-map .detail-heading {display:flex;justify-content:space-between;align-items:start;gap:16px}
    #nf-system-map .detail-kicker {font-size:11px;color:var(--primary)}
    #nf-system-map .detail-heading h3 {font-size:18px;font-weight:600;margin:5px 0 7px;letter-spacing:-.3px}
    #nf-system-map .detail-heading p {font-size:13px;color:var(--muted-foreground);max-width:720px}
    #nf-system-map .detail-actions {display:flex;justify-content:end;gap:4px;flex-wrap:wrap}
    #nf-system-map .detail-branches {display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}
    #nf-system-map .detail-branches .btn {font-size:12px;padding:8px 12px}
    #nf-system-map .detail-branches .btn[aria-pressed="true"] {background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
    #nf-system-map .detail-live {font-size:11px;color:var(--muted-foreground);margin-bottom:16px}
    #nf-system-map .detail-canvas {display:grid;gap:30px;padding:3px 8px}
    #nf-system-map .detail-port {position:relative;background:var(--canvas);border:1px solid var(--border);border-radius:11px;padding:13px 15px;z-index:1;min-width:0}
    #nf-system-map .detail-label {font-size:11px;color:var(--muted-foreground);display:block;margin-bottom:6px}
    #nf-system-map .detail-port-links {display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    #nf-system-map .detail-port p {font-size:13px;margin:8px 0 0}
    #nf-system-map .detail-port-direction {font-size:11px;color:var(--muted-foreground)}
    #nf-system-map .detail-portal {font:inherit;font-size:11px;color:var(--primary);background:var(--accent);border:0;border-radius:5px;padding:4px 7px;max-width:100%;text-align:left;overflow-wrap:anywhere}
    #nf-system-map .detail-portal:hover {background:var(--secondary)}
    #nf-system-map .detail-portal-label {font-size:11px;color:var(--primary)}
    #nf-system-map .detail-chain {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:30px 24px;align-items:stretch}
    #nf-system-map .inner-step {position:relative;z-index:1;min-width:0;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;transition:background .2s,border-color .2s}
    #nf-system-map .inner-step-heading {display:flex;align-items:start;gap:8px;flex-wrap:wrap}
    #nf-system-map .inner-step-heading strong {font-size:13px;font-weight:600;flex:1;min-width:80px}
    #nf-system-map .inner-step-number {width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--muted);font-size:10px;color:var(--muted-foreground);flex-shrink:0}
    #nf-system-map .inner-step p {font-size:12px;color:var(--muted-foreground);margin-top:9px}
    #nf-system-map .inner-step.is-current {border-color:var(--map-active);background:color-mix(in srgb,var(--map-active) 5%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--map-active) 10%,transparent)}
    #nf-system-map .inner-step.is-current .inner-step-number {background:var(--map-active);color:var(--surface)}
    #nf-system-map .inner-step.is-complete {border-color:color-mix(in srgb,var(--viz-series-1) 55%,var(--border))}
    #nf-system-map .inner-step-now {font-size:10px;color:var(--map-active);flex-shrink:0}
    #nf-system-map .inner-dependency {margin-top:10px;font-size:11px;color:var(--muted-foreground)}
    #nf-system-map .inner-wait {display:inline-block;margin-top:10px;font-size:11px;color:var(--primary);border-bottom:1px dashed var(--primary)}
    #nf-system-map .detail-alternative {display:flex;align-items:start;gap:10px;margin-top:18px;font-size:12px;color:var(--muted-foreground);padding:12px 0;border-top:1px solid var(--border)}
    #nf-system-map .detail-alternative>span {font-size:11px;flex-shrink:0;color:var(--primary)}
    #nf-system-map .detail-technical {border-top:1px solid var(--border);margin-top:16px;padding-top:12px}
    #nf-system-map .detail-wires {z-index:0;overflow:visible}
    #nf-system-map .detail-wires .detail-line {fill:none;stroke:var(--border);stroke-width:1.4;stroke-linejoin:round}
    #nf-system-map .detail-wires .detail-line-complete {stroke:var(--viz-series-1)}
    #nf-system-map .detail-wires .detail-line-current {stroke:var(--map-active);stroke-width:2.5}
    #nf-system-map .detail-wires .detail-arrow-future {fill:var(--muted-foreground)}
    #nf-system-map .detail-wires .detail-arrow-complete {fill:var(--viz-series-1)}
    #nf-system-map .detail-wires .detail-arrow-current {fill:var(--map-active)}
    #nf-system-map .map-wires .wire-detail {stroke:var(--viz-series-1);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
    @keyframes detail-enter {from {transform:translateY(10px)}to{transform:translateY(0)}}
    .is-motion-off .module-detail {animation:none!important}
    #nf-system-map .map-foot {padding:14px 4px 0;font-size:11px;color:var(--muted-foreground)}
    #nf-system-map .map-wires path {stroke:color-mix(in srgb,var(--muted-foreground) 40%,transparent)}
    #nf-system-map .map-wires .wire-complete {stroke:var(--viz-series-1);stroke-width:1.6}
    #nf-system-map .map-wires .wire-active {stroke:var(--map-active);stroke-width:3.2}
    #nf-system-map .map-wires .wire-hit {stroke:transparent}
    #nf-system-map .map-wires .wire-arrow {fill:var(--muted-foreground);stroke:none}
    #nf-system-map .map-wires .wire-arrow-active {fill:var(--map-active);stroke:none}
    .mini {position:absolute;top:0;left:0;width:40px;height:19px;display:flex;align-items:center;gap:4px;color:var(--viz-series-1)}
    .mini b {display:block;background:currentColor;border-radius:3px;font-weight:400;transform-origin:center}
    .mini-lines {flex-direction:column;align-items:start;gap:3px;justify-content:center}
    .mini-lines b {height:3px;width:29px;animation:assemble 4.6s ease-in-out infinite}
    .mini-lines b:nth-child(2) {width:38px;opacity:.55;animation-delay:.2s}
    .mini-lines b:nth-child(3) {width:22px;opacity:.3;animation-delay:.4s}
    .mini-network {justify-content:space-between}
    .mini-network:before {content:"";position:absolute;height:1px;background:currentColor;opacity:.25;width:34px;left:3px;top:9px}
    .mini-network b {height:7px;width:7px;border-radius:50%;animation:connect 4.4s ease-in-out infinite;position:relative}
    .mini-network b:nth-child(2) {animation-delay:.5s}.mini-network b:nth-child(3) {animation-delay:1s}
    .mini-stack {flex-direction:column;align-items:start;gap:3px;justify-content:center}
    .mini-stack b {height:4px;width:33px;border-radius:50%;animation:store 5s ease-in-out infinite}
    .mini-stack b:nth-child(2) {opacity:.55;animation-delay:.2s}.mini-stack b:nth-child(3) {opacity:.25;animation-delay:.4s}
    .mini-wave b {height:14px;width:4px;animation:wave 2.7s ease-in-out infinite}
    .mini-wave b:nth-child(2) {height:10px;animation-delay:.2s}.mini-wave b:nth-child(3) {height:18px;animation-delay:.4s}.mini-wave b:nth-child(4) {height:12px;animation-delay:.6s}.mini-wave b:nth-child(5) {height:8px;animation-delay:.8s}
    .map-node[data-awake="false"] .mini b {animation-play-state:paused}
    .is-motion-off .mini b {animation-play-state:paused!important}
    .is-motion-off .mini b {transform:none!important;opacity:.6}
    .is-motion-off .motion-lamp {box-shadow:none;opacity:.45}
    .is-reading-route .mini b {animation-play-state:paused}
    @keyframes assemble {0%,16%,88%,100%{transform:translateX(0)}40%,64%{transform:translateX(5px)}}
    @keyframes connect {0%,20%,80%,100%{transform:scale(.8);opacity:.45}45%,60%{transform:scale(1.12);opacity:1}}
    @keyframes store {0%,20%,85%,100%{transform:translateY(0)}45%,65%{transform:translateY(2px)}}
    @keyframes wave {0%,100%{transform:scaleY(.45);opacity:.45}50%{transform:scaleY(1);opacity:1}}
    @media(max-width:1100px) {
      .atlas-layout {grid-template-columns:190px minmax(0,1fr)}
      .scenario-sidebar {padding-inline:10px}.scenario-link {font-size:12px;padding:11px 10px;gap:6px}
      .atlas-workspace {padding:30px 22px}
      #nf-system-map .map-grid {column-gap:16px;padding-inline:18px}
      #nf-system-map .viz-tile {padding-inline:12px}
      #nf-system-map .map-node-meta {font-size:11px}
      .site-bar {padding-inline:24px}
    }
    @media(max-width:820px) {
      .atlas-layout {display:block}.scenario-sidebar {display:none}
      .atlas-workspace {padding:28px 20px}
      #nf-system-map .map-scenario-controls {display:block;margin-bottom:14px}
      #nf-system-map .map-scenario-controls>.form-label {display:block;font-size:12px;color:var(--muted-foreground)}
      #nf-system-map .map-controls {gap:12px}.hero-note {display:none}.bar-actions>span {display:none}
      #nf-system-map .map-node-meta {font-size:11px}
    }
    @media(max-width:559px) {
      .site-bar {height:62px;padding:0 18px}.bar-label,.bar-divider {display:none}.site-brand {font-size:16px}
      .motion-toggle {font-size:11px;padding:7px 10px}.atlas-workspace {padding:24px 14px}
      h1 {font-size:26px}.page-hero {margin-bottom:20px}
      #nf-system-map .map-board {padding:14px 0;border-radius:14px}
      #nf-system-map .map-node[data-span="all"] {width:100%;max-width:none}
      #nf-system-map .map-grid {padding-inline:24px}
      #nf-system-map .map-node-meta {font-size:11px}
      #nf-system-map .map-controls>.form-label {flex-basis:100%}
      #nf-system-map .map-reader {top:6px;padding:12px}
      #nf-system-map .map-step-controls {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      #nf-system-map .map-step-controls>label:first-child {grid-column:1/-1}
      #nf-system-map .map-step-controls>label:first-child select {flex:1}
      #nf-system-map .map-step-controls .map-auto-speed {display:block}
      #nf-system-map .map-step-controls .map-auto-speed select {width:100%;min-height:38px}
      #nf-system-map .map-step-controls button {min-height:44px}
      #nf-system-map .map-step-controls .form-select {font-size:16px;min-height:44px}
      #nf-system-map .map-legend {font-size:10px;gap:8px 12px}
      #nf-system-map .viz-tile {min-height:88px}
      #nf-system-map .module-detail {padding:14px}
      #nf-system-map .detail-heading {gap:8px}
      #nf-system-map .detail-heading h3 {font-size:16px}
      #nf-system-map .detail-heading .btn {padding:7px 9px}
      #nf-system-map .detail-canvas {padding-inline:0}
      #nf-system-map .detail-alternative {display:block}
      #nf-system-map .detail-alternative p {margin-top:7px}
      #nf-system-map .detail-branches .btn {min-height:44px}
    }
    @media(min-width:560px) and (max-width:680px) {
      #nf-system-map .map-grid {--map-columns:1;grid-template-columns:minmax(0,1fr)}
      #nf-system-map .map-node[data-node] {grid-column:1;grid-row:auto;width:100%;max-width:none}
    }
    @media(prefers-reduced-motion:reduce) {* {scroll-behavior:auto!important}.mini b,.module-detail {animation:none!important}}
    @media(prefers-color-scheme:dark) {#nf-system-map {--map-active:#ffbb70}}
    @media(max-height:680px), (max-width:559px) and (max-height:820px) {#nf-system-map .map-reader {position:relative;top:0}}
  </style>
</head>
<body>
  <header class="site-bar">
    <div class="site-brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>NoteFlow<span class="bar-divider"></span><span class="bar-label">Architecture</span></div>
    <div class="bar-actions"><span>当前实现 · 交互演示</span><button type="button" class="motion-toggle" id="atlas-motion" aria-pressed="true"><span class="motion-lamp" aria-hidden="true"></span><span>动效开启</span></button></div>
  </header>
  <main class="atlas-layout">
    <aside class="scenario-sidebar" aria-label="选择演示流程">
      <div><div class="sidebar-caption">SYSTEM MAP</div><div class="scenario-list"><button type="button" class="scenario-link" data-scenario="overview" aria-current="true"><span class="nav-symbol">◎</span>整个系统</button></div></div>
      <div><div class="sidebar-caption">沿一次操作看</div><nav class="scenario-list">
        <button type="button" class="scenario-link" data-scenario="chat"><span class="nav-symbol">01</span>普通聊天</button>
        <button type="button" class="scenario-link" data-scenario="qa"><span class="nav-symbol">02</span>全库问答</button>
        <button type="button" class="scenario-link" data-scenario="save"><span class="nav-symbol">03</span>手动保存</button>
        <button type="button" class="scenario-link" data-scenario="create"><span class="nav-symbol">04</span>AI 新建笔记</button>
        <button type="button" class="scenario-link" data-scenario="preview"><span class="nav-symbol">05</span>修改预览</button>
        <button type="button" class="scenario-link" data-scenario="quick"><span class="nav-symbol">06</span>选区快捷修改</button>
        <button type="button" class="scenario-link" data-scenario="remember"><span class="nav-symbol">07</span>保存记忆</button>
        <button type="button" class="scenario-link" data-scenario="attachment"><span class="nav-symbol">08</span>上传附件</button>
      </nav></div>
      <div class="sidebar-note"><strong>一张图，逐层看</strong><span>点模块，看输入、处理与输出。</span><span>选操作，跟着数据走。</span><span>仅作架构演示<br>不连接你的业务数据</span></div>
    </aside>
    <section class="atlas-workspace" aria-label="交互架构画布">
      <div class="page-hero"><div><div class="eyebrow">NOTEFLOW / SYSTEM ARCHITECTURE</div><h1>系统架构</h1><p class="hero-description">从一次操作，到回答与保存。</p></div><span class="hero-note">基于代码 · 非实时监控</span></div>
      <!-- SYSTEM_MAP_SOURCE -->
    </section>
  </main>
  <script>
  (()=>{
    const root=document.getElementById('nf-system-map');
    const picker=document.getElementById('nf-map-scenario');
    const links=[...document.querySelectorAll('.scenario-link[data-scenario]')];
    const sync=()=>{
      links.forEach(el=>el.setAttribute('aria-current',String(el.dataset.scenario===picker.value)));
      const title=document.querySelector('.page-hero h1');
      const description=document.querySelector('.hero-description');
      const current=root.querySelector('#nf-map-operation');
      title.textContent=picker.value==='overview'?'系统架构':current.dataset.flowTitle;
      description.textContent=picker.value==='overview'?'从一次操作，到回答与保存。':'示例 · '+current.dataset.flowExample;
    };
    links.forEach(el=>el.addEventListener('click',()=>{picker.value=el.dataset.scenario;picker.dispatchEvent(new Event('change',{bubbles:true}));sync();}));
    picker.addEventListener('change',sync);
    root.addEventListener('nf:readerchange',sync);
    const variants={memory:'network',hindsight:'network',adapter:'network',router:'network',db:'stack',files:'stack',notes:'stack',model:'wave'};
    const observer=new IntersectionObserver(entries=>entries.forEach(entry=>entry.target.dataset.awake=String(entry.isIntersecting)),{rootMargin:'80px'});
    for(const node of root.querySelectorAll('.map-node')){
      const kind=variants[node.dataset.node]||'lines';
      const mark=document.createElement('span');mark.className=`mini mini-${kind}`;mark.setAttribute('aria-hidden','true');
      for(let i=0;i<(kind==='wave'?5:3);i++)mark.append(document.createElement('b'));
      node.querySelector('.viz-tile>span').prepend(mark);observer.observe(node);
    }
    const motion=document.getElementById('atlas-motion');
    const preference=matchMedia('(prefers-reduced-motion:reduce)');
    let enabled=!preference.matches;
    function setMotion(){
      document.body.classList.toggle('is-motion-off',!enabled);
      root.dataset.motion=enabled?'on':'off';
      motion.setAttribute('aria-pressed',String(enabled));
      motion.querySelector('span:last-child').textContent=preference.matches?'系统减少动效':enabled?'动效开启':'动效暂停';
      motion.disabled=preference.matches;
      root.dispatchEvent(new CustomEvent('nf:motionchange'));
    }
    motion.addEventListener('click',()=>{enabled=!enabled;setMotion();});
    preference.addEventListener('change',()=>{enabled=!preference.matches;setMotion();});
    setMotion();sync();
  })();
  </script>
</body>
</html>
